apiVersion: v1
kind: Namespace
metadata:
  name: aiops-traced-config
  labels:
    aiops.testcase: traced-config-crashloop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traced-config-app
  namespace: aiops-traced-config
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import json
    import os
    import re
    import secrets
    import threading
    import time
    import urllib.request

    OTLP_ENDPOINT = os.environ.get("OTLP_ENDPOINT", "http://lgtm.xnet.svc:4318/v1/traces")
    SERVICE_NAME = os.environ.get("OTEL_SERVICE_NAME", "aiops-traced-config-api")
    NAMESPACE = os.environ.get("POD_NAMESPACE", "aiops-traced-config")
    POD_NAME = os.environ.get("HOSTNAME", "")
    REQUIRED_CONFIG = "PAYMENT_GATEWAY_TOKEN"
    failure_count = 0

    def parse_traceparent(value):
        if value:
            match = re.match(r"^00-([0-9a-f]{32})-([0-9a-f]{16})-[0-9a-f]{2}$", value.strip())
            if match:
                return match.group(1), match.group(2)
        return secrets.token_hex(16), secrets.token_hex(8)

    def otlp_value(value):
        if isinstance(value, bool):
            return {"boolValue": value}
        if isinstance(value, int):
            return {"intValue": str(value)}
        return {"stringValue": str(value)}

    def export_span(trace_id, span_id, parent_span_id, start_ns, end_ns, attributes):
        payload = {
            "resourceSpans": [{
                "resource": {"attributes": [
                    {"key": "service.name", "value": {"stringValue": SERVICE_NAME}},
                    {"key": "k8s.namespace.name", "value": {"stringValue": NAMESPACE}},
                    {"key": "k8s.pod.name", "value": {"stringValue": POD_NAME}},
                ]},
                "scopeSpans": [{
                    "scope": {"name": "aiops.traced_config.manual"},
                    "spans": [{
                        "traceId": trace_id,
                        "spanId": span_id,
                        "parentSpanId": parent_span_id,
                        "name": "GET /checkout",
                        "kind": 2,
                        "startTimeUnixNano": str(start_ns),
                        "endTimeUnixNano": str(end_ns),
                        "attributes": [
                            {"key": key, "value": otlp_value(value)}
                            for key, value in attributes.items()
                        ],
                        "status": {
                            "code": 2,
                            "message": f"required config {REQUIRED_CONFIG} is missing",
                        },
                    }],
                }],
            }],
        }
        request = urllib.request.Request(
            OTLP_ENDPOINT,
            data=json.dumps(payload).encode(),
            headers={"content-type": "application/json"},
        )
        try:
            with urllib.request.urlopen(request, timeout=2) as response:
                response.read()
        except Exception as exc:
            print(json.dumps({
                "event": "otlp_export_error",
                "trace_id": trace_id,
                "error": str(exc),
            }), flush=True)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            global failure_count
            if self.path == "/health":
                body = b'{"status":"up"}'
                self.send_response(200)
                self.send_header("content-type", "application/json")
                self.send_header("content-length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return

            start_ns = time.time_ns()
            trace_id, parent_span_id = parse_traceparent(self.headers.get("traceparent"))
            span_id = secrets.token_hex(8)
            failure_count += 1
            config_present = bool(os.environ.get(REQUIRED_CONFIG))
            status_code = 200 if config_present else 500
            error_code = "" if config_present else "CONFIG_MISSING"
            event = "checkout_succeeded" if config_present else "config_missing"
            message = (
                "checkout accepted"
                if config_present
                else f"required config {REQUIRED_CONFIG} is missing"
            )
            end_ns = time.time_ns()
            attributes = {
                "http.request.method": "GET",
                "http.route": "/checkout",
                "http.response.status_code": status_code,
                "url.path": self.path,
                "error.type": error_code,
                "config.key": REQUIRED_CONFIG,
                "config.present": config_present,
                "aiops.failure_count": failure_count,
                "k8s.pod.name": POD_NAME,
            }
            export_span(
                trace_id,
                span_id,
                parent_span_id,
                start_ns,
                end_ns,
                attributes,
            )
            log = {
                "event": event,
                "level": "error" if status_code == 500 else "info",
                "message": message,
                "error_code": error_code,
                "missing_config": REQUIRED_CONFIG if not config_present else "",
                "http_status": status_code,
                "path": self.path,
                "failure_count": failure_count,
                "trace_id": trace_id,
                "span_id": span_id,
                "parent_span_id": parent_span_id,
                "pod": POD_NAME,
                "service": SERVICE_NAME,
            }
            print(json.dumps(log), flush=True)
            body = json.dumps(log).encode()
            self.send_response(status_code)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
            self.wfile.flush()
            if not config_present and failure_count >= 3:
                print(json.dumps({
                    "event": "fatal_configuration_error",
                    "message": message,
                    "exit_code": 78,
                    "failure_count": failure_count,
                }), flush=True)
                threading.Timer(0.5, lambda: os._exit(78)).start()

        def log_message(self, fmt, *args):
            return

    print(json.dumps({
        "event": "traced_config_api_started",
        "service": SERVICE_NAME,
        "pod": POD_NAME,
        "required_config": REQUIRED_CONFIG,
        "config_present": bool(os.environ.get(REQUIRED_CONFIG)),
        "otlp_endpoint": OTLP_ENDPOINT,
    }), flush=True)
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

  driver.py: |
    import json
    import secrets
    import time
    import urllib.error
    import urllib.request

    step = 0
    while True:
        step += 1
        trace_id = secrets.token_hex(16)
        span_id = secrets.token_hex(8)
        traceparent = f"00-{trace_id}-{span_id}-01"
        url = f"http://trace-config-api:8080/checkout?order_id=order-{step}"
        request = urllib.request.Request(
            url,
            headers={
                "traceparent": traceparent,
                "x-aiops-case": "traced-config-crashloop",
                "x-aiops-step": str(step),
            },
        )
        try:
            with urllib.request.urlopen(request, timeout=5) as response:
                body = response.read().decode()
                print(json.dumps({
                    "event": "request_succeeded",
                    "step": step,
                    "trace_id": trace_id,
                    "traceparent": traceparent,
                    "status": response.status,
                    "target": url,
                    "response": json.loads(body),
                }), flush=True)
        except urllib.error.HTTPError as exc:
            body = exc.read().decode()
            print(json.dumps({
                "event": "request_failed",
                "step": step,
                "trace_id": trace_id,
                "traceparent": traceparent,
                "status": exc.code,
                "target": url,
                "response": json.loads(body),
            }), flush=True)
        except Exception as exc:
            print(json.dumps({
                "event": "request_unavailable",
                "step": step,
                "trace_id": trace_id,
                "traceparent": traceparent,
                "target": url,
                "error": str(exc),
            }), flush=True)
        time.sleep(2)
---
apiVersion: v1
kind: Service
metadata:
  name: trace-config-api
  namespace: aiops-traced-config
  labels:
    aiops.testcase: traced-config-crashloop
    app: trace-config-api
spec:
  selector:
    app: trace-config-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-config-api
  namespace: aiops-traced-config
  labels:
    aiops.testcase: traced-config-crashloop
    app: trace-config-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trace-config-api
  template:
    metadata:
      labels:
        aiops.testcase: traced-config-crashloop
        app: trace-config-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: business-api
          image: xnet.registry.io:8443/observability/python:3-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/server.py"]
          env:
            - name: OTLP_ENDPOINT
              value: http://lgtm.xnet.svc:4318/v1/traces
            - name: OTEL_SERVICE_NAME
              value: aiops-traced-config-api
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: traced-config-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-config-driver
  namespace: aiops-traced-config
  labels:
    aiops.testcase: traced-config-crashloop
    app: trace-config-driver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trace-config-driver
  template:
    metadata:
      labels:
        aiops.testcase: traced-config-crashloop
        app: trace-config-driver
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: driver
          image: xnet.registry.io:8443/observability/python:3-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/driver.py"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: traced-config-app
