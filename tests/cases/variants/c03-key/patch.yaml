{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "workload",
    "labels": {
      "aiops.lab/case-id": "v05"
    }
  },
  "spec": {
    "volumes": [
      {
        "name": "input",
        "configMap": {
          "name": "workload-input",
          "items": [
            {
              "key": "unavailable-key",
              "path": "app.conf"
            }
          ]
        }
      }
    ],
    "containers": [
      {
        "name": "app",
        "volumeMounts": [
          {
            "name": "input",
            "mountPath": "/input",
            "readOnly": true
          }
        ]
      }
    ]
  }
}
