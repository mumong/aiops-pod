{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "workload",
    "labels": {
      "aiops.lab/case-id": "v11"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "env": [
          {
            "name": "APP_INPUT",
            "valueFrom": {
              "configMapKeyRef": {
                "name": "workload-input",
                "key": "unavailable-key"
              }
            }
          }
        ]
      }
    ]
  }
}
