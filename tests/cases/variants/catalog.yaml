    {
      "id": "c02-tag",
      "name": "c02-tag",
      "directory": "variants/c02-tag",
      "namespace": "aiops-case-v07",
      "symptom": "ImagePullBackOff",
      "fault_scenario": "已有镜像仓库中的镜像 tag 不存在",
      "workload_kind": "Pod",
      "workload_name": "workload",
      "container": "app",
      "trigger": "apply",
      "timeout_seconds": 240,
      "status_gate": {
        "waiting_reasons": [
          "ErrImagePull",
          "ImagePullBackOff"
        ],
        "event_reasons": [
          "Failed"
        ],
        "event_patterns_all": [
          "(?:manifest unknown|manifest.{0,100}(?:not found|unknown)|(?:python|pause):aiops-fixture-unavailable-20260908.{0,40}not found)"
        ],
        "fail_fast_event_patterns": [
          "x509:.*(?:unknown authority|expired|not valid)",
          "(?:401|403).*(?:unauthorized|forbidden)"
        ]
      },
      "cleanup": {
        "namespace": "aiops-case-v07"
      },
      "prerequisites": "节点可访问 registry.cn-hangzhou.aliyuncs.com/google_containers/pause；正常 tag 3.9 应可解析，测试 tag 必须返回 MANIFEST_UNKNOWN/not found；TLS、DNS、鉴权失败均不算目标故障，不修改节点信任配置",
      "telemetry_note": "此扩展阶段只验收真实 Kubernetes 状态、事件及必要容器日志；不宣称已有完整 Metrics/Logging/Tracing 覆盖"
