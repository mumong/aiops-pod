{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "workload",
    "labels": {
      "app.kubernetes.io/name": "workload"
    }
  },
  "spec": {
    "automountServiceAccountToken": false,
    "restartPolicy": "Always",
    "terminationGracePeriodSeconds": 5,
    "securityContext": {
      "runAsNonRoot": true,
      "runAsUser": 1000,
      "runAsGroup": 1000,
      "fsGroup": 1000,
      "seccompProfile": {
        "type": "RuntimeDefault"
      }
    },
    "containers": [
      {
        "name": "app",
        "image": "xnet.registry.io:8443/observability/python:3-alpine",
        "imagePullPolicy": "IfNotPresent",
        "command": [
          "python3",
          "-u",
          "-c",
          "import time; print('application started', flush=True); time.sleep(86400)"
        ],
        "resources": {
          "requests": {
            "cpu": "5m",
            "memory": "8Mi"
          },
          "limits": {
            "cpu": "50m",
            "memory": "32Mi"
          }
        },
        "securityContext": {
          "allowPrivilegeEscalation": false,
          "readOnlyRootFilesystem": true,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          }
        }
      }
    ]
  }
}
