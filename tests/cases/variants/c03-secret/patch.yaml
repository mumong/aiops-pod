{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "workload",
    "labels": {
      "aiops.lab/case-id": "v04"
    }
  },
  "spec": {
    "volumes": [
      {
        "name": "input",
        "secret": {
          "secretName": "unavailable-input"
        }
      }
    ],
    "containers": [
      {
        "name": "app",
        "volumeMounts": [
          {
            "name": "input",
            "mountPath": "/input",
            "readOnly": true
          }
        ]
      }
    ]
  }
}
