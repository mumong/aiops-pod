# Pod VolumeMountFailed E2E 场景
# 预期状态：ContainerCreating/Pending，Events 出现 FailedMount 或 ConfigMap not found
apiVersion: v1
kind: Pod
metadata:
  name: volume-mount-failed
  namespace: aiops-e2e
  annotations:
    aiops.e2e/runbook: pod-volume-mount-failed.md
    aiops.e2e/expected-status: Pending|ContainerCreating
    aiops.e2e/expected-evidence: "Events contain FailedMount or configmap not found"
  labels:
    app: volume-mount-failed
    e2e-test: "true"
    pod_abnormal_type: VolumeMountFailed
    expected_layer: L0
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: missing-config
          mountPath: /etc/missing-config
  volumes:
    - name: missing-config
      configMap:
        name: definitely-missing-configmap
