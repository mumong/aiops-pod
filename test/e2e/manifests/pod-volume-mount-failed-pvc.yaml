# Pod VolumeMountFailed E2E 场景：Pod 引用不存在的 PVC
# 预期状态：ContainerCreating/Pending，Events 出现 persistentvolumeclaim not found
apiVersion: v1
kind: Pod
metadata:
  name: volume-mount-missing-pvc
  namespace: aiops-e2e
  annotations:
    aiops.e2e/runbook: pod-volume-mount-failed.md
    aiops.e2e/expected-status: Pending|ContainerCreating
    aiops.e2e/expected-evidence: "Events contain FailedMount or persistentvolumeclaim not found"
  labels:
    app: volume-mount-missing-pvc
    e2e-test: "true"
    pod_abnormal_type: VolumeMountFailed
    expected_layer: L0
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: missing-pvc
          mountPath: /data
  volumes:
    - name: missing-pvc
      persistentVolumeClaim:
        claimName: definitely-missing-pvc
