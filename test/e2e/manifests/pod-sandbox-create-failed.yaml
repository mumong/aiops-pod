# Pod SandboxCreateFailed E2E 场景模板
# 预期：如果集群无 runtimeClassName=missing-runtime-handler，则 kubelet/runtime 无法创建 sandbox。
apiVersion: v1
kind: Pod
metadata:
  name: sandbox-create-failed
  namespace: aiops-e2e
  annotations:
    aiops.e2e/runbook: pod-sandbox-create-failed.md
    aiops.e2e/expected-status: ContainerCreating|Pending
    aiops.e2e/expected-evidence: "Events contain FailedCreatePodSandBox or RuntimeClass handler not found"
  labels:
    app: sandbox-create-failed
    e2e-test: "true"
    pod_abnormal_type: SandboxCreateFailed
    expected_layer: L3
spec:
  runtimeClassName: missing-runtime-handler
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
