# Pod VolumeMountFailed E2E 场景：ConfigMap 存在但 volume.items 指定的 key 不存在
# 预期状态：ContainerCreating/Pending，Events 出现 couldn't find key
apiVersion: v1
kind: ConfigMap
metadata:
  name: volume-key-config
  namespace: aiops-e2e
  labels:
    e2e-test: "true"
data:
  existing-key: "present"
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-mount-missing-configmap-key
  namespace: aiops-e2e
  annotations:
    aiops.e2e/runbook: pod-volume-mount-failed.md
    aiops.e2e/expected-status: Pending|ContainerCreating
    aiops.e2e/expected-evidence: "Events contain FailedMount or couldn't find key missing-key"
  labels:
    app: volume-mount-missing-configmap-key
    e2e-test: "true"
    pod_abnormal_type: VolumeMountFailed
    expected_layer: L0
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: volume-key-config
        items:
          - key: missing-key
            path: missing-key
