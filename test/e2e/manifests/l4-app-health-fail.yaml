# L4-ApplicationHealthFail E2E 场景
# 单 Pod 应用健康检查失败，日志含 L4_APP_HEALTH_FAIL 等标记
# 部署: kubectl apply -f test/e2e/manifests/l4-app-health-fail.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apphealth
  namespace: aiops-e2e
  labels:
    l4-scenario: app-health-fail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apphealth
  template:
    metadata:
      labels:
        app: apphealth
        l4-scenario: app-health-fail
    spec:
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "L4_APP_HEALTH_FAIL: Application health check failed - L4 application layer issue"
                echo "L4_LAYER_APPLICATION: true"
                echo "L4_SCENARIO: app-health-fail"
                sleep 5
              done
