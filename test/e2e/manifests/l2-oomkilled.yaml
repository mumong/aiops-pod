apiVersion: apps/v1
kind: Deployment
metadata:
  name: memhog
  namespace: aiops-e2e
  labels:
    e2e-test: "true"
    pod_abnormal_type: OOMKilled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memhog
  template:
    metadata:
      annotations:
        aiops.e2e/runbook: l2-oomkilled.md
        aiops.e2e/expected-status: CrashLoopBackOff|Error
        aiops.e2e/expected-evidence: "container Last State reason is OOMKilled and exitCode is 137"
      labels:
        app: memhog
        e2e-test: "true"
        pod_abnormal_type: OOMKilled
    spec:
      containers:
        - name: memhog
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import time
              a=[]
              while True:
                a.append("x"*1024*1024)  # 1MiB
                time.sleep(0.02)
          resources:
            requests:
              cpu: "50m"
              memory: "20Mi"
            limits:
              cpu: "200m"
              memory: "40Mi"
