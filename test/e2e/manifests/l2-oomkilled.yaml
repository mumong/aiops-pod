apiVersion: apps/v1
kind: Deployment
metadata:
  name: memhog
  namespace: aiops-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memhog
  template:
    metadata:
      labels:
        app: memhog
    spec:
      containers:
        - name: memhog
          image: python:3.11-slim
          command: ["python", "-c"]
          args:
            - |
              import time
              a=[]
              while True:
                a.append("x"*1024*1024)  # 1MiB
                time.sleep(0.02)
          resources:
            requests:
              cpu: "50m"
              memory: "20Mi"
            limits:
              cpu: "200m"
              memory: "40Mi"

