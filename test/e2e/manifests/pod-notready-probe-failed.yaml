# Pod NotReadyProbeFailed E2E 场景
# 预期状态：Running 但 READY=0/1，Events 出现 Readiness probe failed
apiVersion: v1
kind: Pod
metadata:
  name: notready-probe-failed
  namespace: aiops-e2e
  annotations:
    aiops.e2e/runbook: pod-notready-probe-failed.md
    aiops.e2e/expected-status: Running
    aiops.e2e/expected-evidence: "Pod phase is Running but READY is 0/1 and Events contain Readiness probe failed"
  labels:
    app: notready-probe-failed
    e2e-test: "true"
    pod_abnormal_type: NotReadyProbeFailed
    expected_layer: L4
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 86400"]
      readinessProbe:
        exec:
          command: ["sh", "-c", "exit 1"]
        initialDelaySeconds: 1
        periodSeconds: 3
