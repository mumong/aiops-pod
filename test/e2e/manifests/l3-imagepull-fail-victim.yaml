# Pod ImagePullFailed E2E 场景
# 预期结果：Pod 状态变为 ErrImagePull/ImagePullBackOff，Events 含 Failed to pull image

apiVersion: v1
kind: Pod
metadata:
  name: imagepull-fail-victim
  namespace: aiops-e2e
  annotations:
    aiops.e2e/runbook: l3-imagepull-failed.md
    aiops.e2e/expected-status: ImagePullBackOff|ErrImagePull
    aiops.e2e/expected-evidence: "Events contain Failed to pull image for an invalid registry host"
  labels:
    app: imagepull-fail-victim
    e2e-test: "true"
    pod_abnormal_type: ImagePullFailed
spec:
  containers:
    - name: app
      image: registry.invalid/aiops/imagepull-fail:v0
      imagePullPolicy: Always
  restartPolicy: Never
