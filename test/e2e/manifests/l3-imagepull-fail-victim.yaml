# L3 网络层故障受害者 Pod
# 故障原理：因为镜像仓库网络被阻断，无法拉取镜像
# 预期结果：Pod 状态变为 ImagePullBackOff
#
# 前置条件：先部署 l3-registry-block.yaml 阻断镜像仓库访问
# 预期异常：kubectl get pod 会显示 STATUS = ImagePullBackOff

apiVersion: v1
kind: Pod
metadata:
  name: imagepull-fail-victim
  namespace: aiops-e2e
  labels:
    app: imagepull-fail-victim
    fault_level: "L3"
    fault_type: "registry_unreachable"
    expected_state: "ImagePullBackOff"
    # 标识这是一个测试用的受害者 Pod
    role: "fault_injection_victim"
spec:
  containers:
    - name: nginx
      # 使用 Docker Hub 镜像，会被 registry-blocker 阻断
      image: nginx:latest
      # 强制重新拉取镜像（不使用本地缓存）
      imagePullPolicy: Always
  restartPolicy: Never
