apiVersion: v1
kind: Service
metadata:
  name: dep503
  namespace: aiops-e2e
  labels:
    l4-scenario: dependency-503
spec:
  selector:
    app: dep503
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep503
  namespace: aiops-e2e
  labels:
    l4-scenario: dependency-503
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dep503
  template:
    metadata:
      labels:
        app: dep503
        l4-scenario: dependency-503
    spec:
      containers:
        - name: dep
          image: nginx:alpine
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              echo "L4_DEPENDENCY_503_SERVICE: Starting - All requests will return 503"
              echo "=========================="
              echo "nginx config: all requests return 503"

              cat >/etc/nginx/conf.d/return503.conf <<'EOF'
              server {
                listen 80;
                location / {
                  return 503;
                  add_header X-L4-Fault-Injection dependency-503;
                }
              }
              EOF

              exec nginx -g "daemon off; error_log /dev/stderr alert; access_log /dev/stdout;"
---
apiVersion: v1
kind: Service
metadata:
  name: appcaller
  namespace: aiops-e2e
  labels:
    l4-scenario: dependency-503
spec:
  selector:
    app: appcaller
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appcaller
  namespace: aiops-e2e
  labels:
    l4-scenario: dependency-503
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appcaller
  template:
    metadata:
      labels:
        app: appcaller
        l4-scenario: dependency-503
    spec:
      containers:
        - name: app
          image: curlimages/curl:latest
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              echo "L4_DEPENDENCY_503_CLIENT: Starting - Continuous monitoring of dep503 service"
              echo "=========================="

              while true; do
                TIMESTAMP="$(date -Iseconds)"
                echo "--- L4_FAULT_TEST [$TIMESTAMP] ---"

                RESULT="$(curl -s -o /dev/null -w '%{http_code}\n' --max-time 2 http://dep503.aiops-e2e.svc.cluster.local:80/ || echo 000)"
                echo "L4_UPSTREAM_HTTP_CODE: ${RESULT}"

                if [ "${RESULT}" = "503" ]; then
                  echo "L4_DEPENDENCY_FAULT: DEP503 returning 503 - ISSUE CONFIRMED"
                  echo "L4_FAULT_STATUS: ACTIVE"
                  echo "=========================="
                else
                  echo "L4_DEPENDENCY_OK: DEP503 returned ${RESULT} - ISSUE RESOLVED"
                  echo "L4_FAULT_STATUS: RESOLVED"
                  echo "=========================="
                fi

                sleep 3
              done

