apiVersion: apps/v1
kind: Deployment
metadata:
  name: l1-test-nginx
  namespace: aiops-e2e
  labels:
    e2e-test: "true"
    pod_abnormal_type: PendingUnschedulable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-unschedulable
  template:
    metadata:
      annotations:
        aiops.e2e/runbook: l1-taint-node.md
        aiops.e2e/expected-status: Pending
        aiops.e2e/expected-evidence: "Events contain FailedScheduling because nodeSelector cannot match any node"
      labels:
        app: pending-unschedulable
        e2e-test: "true"
        pod_abnormal_type: PendingUnschedulable
    spec:
      nodeSelector:
        aiops.e2e/nonexistent-node: "true"
      containers:
      - name: app
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 3600"]
