apiVersion: apps/v1
kind: Deployment
metadata:
  name: l1-test-nginx
  namespace: aiops-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      nodeSelector:
        kubernetes.io/hostname: node2
      containers:
      - name: nginx
        image: nginx:alpine
