# Pod VolumeMountFailed E2E 场景：Secret 卷引用不存在
# 预期状态：ContainerCreating/Pending，Events 出现 secret not found
apiVersion: v1
kind: Pod
metadata:
  name: volume-mount-missing-secret
  namespace: aiops-e2e
  annotations:
    aiops.e2e/runbook: pod-volume-mount-failed.md
    aiops.e2e/expected-status: Pending|ContainerCreating
    aiops.e2e/expected-evidence: "Events contain FailedMount or secret not found"
  labels:
    app: volume-mount-missing-secret
    e2e-test: "true"
    pod_abnormal_type: VolumeMountFailed
    expected_layer: L0
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: missing-secret
          mountPath: /etc/missing-secret
          readOnly: true
  volumes:
    - name: missing-secret
      secret:
        secretName: definitely-missing-secret
