# Pod VolumeMountFailed E2E 场景：hostPath 指定 Directory 但路径不存在
# 预期状态：ContainerCreating/Pending，Events 出现 hostPath type check failed
apiVersion: v1
kind: Pod
metadata:
  name: volume-mount-hostpath-missing
  namespace: aiops-e2e
  annotations:
    aiops.e2e/runbook: pod-volume-mount-failed.md
    aiops.e2e/expected-status: Pending|ContainerCreating
    aiops.e2e/expected-evidence: "Events contain FailedMount or hostPath type check failed"
  labels:
    app: volume-mount-hostpath-missing
    e2e-test: "true"
    pod_abnormal_type: VolumeMountFailed
    expected_layer: L0
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: missing-hostpath
          mountPath: /mnt/missing-hostpath
  volumes:
    - name: missing-hostpath
      hostPath:
        path: /tmp/aiops-e2e-definitely-missing-hostpath-dir
        type: Directory
