            "CPU"
          ],
          "mechanisms_any": [
            "(?:请求|request)[^。\\n]{0,100}(?:过大|过高|超出|超过|远超|不合理|极端|100k|100000|100,000|十万)",
            "(?:100k|100000|100,000|十万)[^。\\n]{0,100}(?:超|不合理|无法|不可)"
          ],
          "reject_patterns": [
            "0\\.0*1\\s*(?:核|core)",
            "(?:请求|request)[^。\\n]{0,30}(?:正常|合理|不高)"
          ]
        }
      ]
    },
