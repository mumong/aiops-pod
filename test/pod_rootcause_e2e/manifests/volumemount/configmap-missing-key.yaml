apiVersion: v1
kind: ConfigMap
metadata:
  name: rc-volume-key-config
  namespace: aiops-e2e
  labels:
    rootcause-e2e: "true"
data:
  existing-key: "present"
---
apiVersion: v1
kind: Pod
metadata:
  name: rc-volume-configmap-missing-key
  namespace: aiops-e2e
  labels:
    app: rc-volume-configmap-missing-key
    rootcause-e2e: "true"
    pod_abnormal_type: VolumeMountFailed
  annotations:
    aiops.e2e/runbook: pod-volume-mount-failed.md
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: rc-volume-key-config
        items:
          - key: missing-key
            path: missing-key
