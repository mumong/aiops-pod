apiVersion: v1
kind: Pod
metadata:
  name: rc-pending-insufficient-memory
  namespace: aiops-e2e
  labels:
    app: rc-pending-insufficient-memory
    rootcause-e2e: "true"
    pod_abnormal_type: PendingUnschedulable
  annotations:
    aiops.e2e/runbook: pod-pending-unschedulable.md
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "100000Gi"
