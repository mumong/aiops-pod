apiVersion: v1
kind: Pod
metadata:
  name: rc-pending-nodeselector
  namespace: aiops-e2e
  labels:
    app: rc-pending-nodeselector
    rootcause-e2e: "true"
    pod_abnormal_type: PendingUnschedulable
  annotations:
    aiops.e2e/runbook: pod-pending-unschedulable.md
spec:
  nodeSelector:
    aiops.e2e/nonexistent-node-label: "true"
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
