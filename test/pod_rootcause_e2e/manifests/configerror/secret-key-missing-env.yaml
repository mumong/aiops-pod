apiVersion: v1
kind: Secret
metadata:
  name: rc-app-secret
  namespace: aiops-e2e
  labels:
    rootcause-e2e: "true"
type: Opaque
stringData:
  EXISTING_SECRET_KEY: "present"
---
apiVersion: v1
kind: Pod
metadata:
  name: rc-config-secret-key-missing
  namespace: aiops-e2e
  labels:
    app: rc-config-secret-key-missing
    rootcause-e2e: "true"
    pod_abnormal_type: ConfigError
  annotations:
    aiops.e2e/runbook: pod-config-error.md
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: APP_SECRET_TOKEN
          valueFrom:
            secretKeyRef:
              name: rc-app-secret
              key: APP_SECRET_TOKEN
