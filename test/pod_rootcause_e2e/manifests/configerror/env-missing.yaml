apiVersion: apps/v1
kind: Deployment
metadata:
  name: rc-config-env-missing
  namespace: aiops-e2e
  labels:
    rootcause-e2e: "true"
    pod_abnormal_type: ConfigError
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rc-config-env-missing
  template:
    metadata:
      labels:
        app: rc-config-env-missing
        rootcause-e2e: "true"
        pod_abnormal_type: ConfigError
      annotations:
        aiops.e2e/runbook: pod-config-error.md
    spec:
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "${APP_BOOT_MODE:-}" ]; then
                echo "L4_CONFIG_BOOTSTRAP_FAIL: missing required APP_BOOT_MODE"
                exit 42
              fi
              sleep 3600
