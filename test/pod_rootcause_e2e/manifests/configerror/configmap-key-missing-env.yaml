apiVersion: v1
kind: ConfigMap
metadata:
  name: rc-app-config
  namespace: aiops-e2e
  labels:
    rootcause-e2e: "true"
data:
  EXISTING_KEY: "present"
---
apiVersion: v1
kind: Pod
metadata:
  name: rc-config-configmap-key-missing
  namespace: aiops-e2e
  labels:
    app: rc-config-configmap-key-missing
    rootcause-e2e: "true"
    pod_abnormal_type: ConfigError
  annotations:
    aiops.e2e/runbook: pod-config-error.md
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: APP_BOOT_MODE
          valueFrom:
            configMapKeyRef:
              name: rc-app-config
              key: APP_BOOT_MODE
