apiVersion: apps/v1
kind: Deployment
metadata:
  name: rc-crashloop-exit-code
  namespace: aiops-e2e
  labels:
    rootcause-e2e: "true"
    pod_abnormal_type: CrashLoopBackOffRuntime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rc-crashloop-exit-code
  template:
    metadata:
      labels:
        app: rc-crashloop-exit-code
        rootcause-e2e: "true"
        pod_abnormal_type: CrashLoopBackOffRuntime
      annotations:
        aiops.e2e/runbook: pod-crashloop-runtime.md
    spec:
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              echo "RUNTIME_STARTUP_ERROR: rc crashloop exits with code 2"
              exit 2
