apiVersion: apps/v1
kind: Deployment
metadata:
  name: rc-crashloop-config-file-missing
  namespace: aiops-e2e
  labels:
    rootcause-e2e: "true"
    pod_abnormal_type: CrashLoopBackOffRuntime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rc-crashloop-config-file-missing
  template:
    metadata:
      labels:
        app: rc-crashloop-config-file-missing
        rootcause-e2e: "true"
        pod_abnormal_type: CrashLoopBackOffRuntime
      annotations:
        aiops.e2e/runbook: pod-crashloop-runtime.md
    spec:
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              echo "RUNTIME_STARTUP_ERROR: required config file missing"
              cat /etc/rootcause-app/config.yaml
