apiVersion: v1
kind: Pod
metadata:
  name: rc-imagepull-invalid-registry
  namespace: aiops-e2e
  labels:
    app: rc-imagepull-invalid-registry
    rootcause-e2e: "true"
    pod_abnormal_type: ImagePullFailed
  annotations:
    aiops.e2e/runbook: pod-imagepull-failed.md
spec:
  containers:
    - name: app
      image: registry.invalid/aiops/rootcause:v0
      imagePullPolicy: Always
  restartPolicy: Never
