apiVersion: v1
kind: Pod
metadata:
  name: rc-imagepull-missing-secret
  namespace: aiops-e2e
  labels:
    app: rc-imagepull-missing-secret
    rootcause-e2e: "true"
    pod_abnormal_type: ImagePullFailed
  annotations:
    aiops.e2e/runbook: pod-imagepull-failed.md
spec:
  imagePullSecrets:
    - name: rc-definitely-missing-pull-secret
  containers:
    - name: app
      image: registry.invalid/aiops/private-rootcause:v0
      imagePullPolicy: Always
  restartPolicy: Never
