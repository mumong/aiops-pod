apiVersion: v1
kind: Pod
metadata:
  name: rc-imagepull-not-found
  namespace: aiops-e2e
  labels:
    app: rc-imagepull-not-found
    rootcause-e2e: "true"
    pod_abnormal_type: ImagePullFailed
  annotations:
    aiops.e2e/runbook: pod-imagepull-failed.md
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:definitely-not-existing-rootcause-tag
      imagePullPolicy: Always
  restartPolicy: Never
