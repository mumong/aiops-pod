apiVersion: v1
kind: Pod
metadata:
  name: rc-notready-readiness
  namespace: aiops-e2e
  labels:
    app: rc-notready-readiness
    rootcause-e2e: "true"
    pod_abnormal_type: NotReadyProbeFailed
  annotations:
    aiops.e2e/runbook: pod-notready-probe-failed.md
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 86400"]
      readinessProbe:
        exec:
          command: ["sh", "-c", "echo readiness dependency unavailable; exit 1"]
        initialDelaySeconds: 1
        periodSeconds: 3
