apiVersion: v1
kind: Pod
metadata:
  name: rc-terminating-long-grace
  namespace: aiops-e2e
  labels:
    app: rc-terminating-long-grace
    rootcause-e2e: "true"
    pod_abnormal_type: TerminatingStuck
  annotations:
    aiops.e2e/runbook: pod-terminating-stuck.md
spec:
  terminationGracePeriodSeconds: 21600
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "trap 'sleep 21600' TERM; sleep 86400"]
