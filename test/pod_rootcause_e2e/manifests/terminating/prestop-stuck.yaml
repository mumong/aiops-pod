apiVersion: v1
kind: Pod
metadata:
  name: rc-terminating-prestop
  namespace: aiops-e2e
  labels:
    app: rc-terminating-prestop
    rootcause-e2e: "true"
    pod_abnormal_type: TerminatingStuck
  annotations:
    aiops.e2e/runbook: pod-terminating-stuck.md
spec:
  terminationGracePeriodSeconds: 600
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 86400"]
      lifecycle:
        preStop:
          exec:
            command: ["sh", "-c", "echo rootcause prestop hook stuck; sleep 600"]
