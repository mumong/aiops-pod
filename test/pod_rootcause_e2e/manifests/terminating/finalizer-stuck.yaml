apiVersion: v1
kind: Pod
metadata:
  name: rc-terminating-finalizer
  namespace: aiops-e2e
  labels:
    app: rc-terminating-finalizer
    rootcause-e2e: "true"
    pod_abnormal_type: TerminatingStuck
  annotations:
    aiops.e2e/runbook: pod-terminating-stuck.md
  finalizers:
    - aiops.e2e/rootcause-finalizer
spec:
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 86400"]
