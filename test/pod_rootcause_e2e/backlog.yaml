# Future root-cause cases. These are useful but not stable enough for v1-core
# unattended nightly runs.
backlog:
  - id: node-lost-unknown
    group: unknown
    reason: "需要停止 kubelet 或隔离节点网络，属于破坏性环境操作。"
  - id: sandbox-cni-ipam-failure
    group: sandbox
    reason: "依赖真实 CNI/IPAM 故障注入，不同集群行为差异大。"
  - id: imagepull-x509-cert-error
    group: imagepull
    reason: "需要带错误证书的 registry，单纯 manifest 难以稳定复现。"
  - id: imagepull-registry-unauthorized
    group: imagepull
    reason: "需要私有 registry 和固定鉴权失败条件。"
  - id: evicted-ephemeral-storage
    group: evicted
    reason: "可复现但耗时且受节点资源/驱逐阈值影响，不适合先放入精确夜间测试。"
  - id: pvc-provisioner-failure
    group: volumemount
    reason: "依赖集群 StorageClass/provisioner 行为。"
  - id: volume-node-affinity-conflict
    group: pending
    reason: "需要 PV NodeAffinity 和节点拓扑条件，环境成本较高。"
  - id: hostport-conflict
    group: pending
    reason: "可做，但优先级低于 CPU/Memory/nodeSelector/PVC 等主流原因。"
