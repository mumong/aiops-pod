apiVersion: v1
kind: Namespace
metadata: {name: aiops-case-05}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload
  labels: {aiops.lab/case-id: c05}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: workload}
  template:
    metadata:
      labels: {app.kubernetes.io/name: workload, aiops.lab/case-id: c05}
      annotations:
        k8s.v1.cni.cncf.io/networks: unavailable-network
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: xnet.registry.io:8443/observability/python:3-alpine
          command: ["python3", "-c", "import time; time.sleep(3600)"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
