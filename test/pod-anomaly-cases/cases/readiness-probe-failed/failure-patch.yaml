apiVersion: apps/v1
kind: Deployment
metadata: {name: workload}
spec:
  template:
    metadata:
      labels: {aiops.lab/case-id: c09}
    spec:
      containers:
        - name: app
          env:
            - {name: FAILURE_MODE, value: normal}
          readinessProbe:
            httpGet: {path: /ready, port: 8081}
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 1
