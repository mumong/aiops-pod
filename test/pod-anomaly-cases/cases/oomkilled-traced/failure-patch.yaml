apiVersion: apps/v1
kind: Deployment
metadata: {name: workload}
spec:
  template:
    metadata:
      labels: {aiops.lab/case-id: c08}
    spec:
      containers:
        - name: app
          env:
            - {name: FAILURE_MODE, value: oom_growth}
            - {name: OOM_STEP_MIB, value: "2"}
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {cpu: 200m, memory: 64Mi}
