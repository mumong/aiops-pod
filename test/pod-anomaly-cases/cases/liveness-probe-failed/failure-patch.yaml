apiVersion: apps/v1
kind: Deployment
metadata: {name: workload}
spec:
  template:
    metadata:
      labels: {aiops.lab/case-id: c10}
    spec:
      containers:
        - name: app
          env:
            - {name: FAILURE_MODE, value: liveness_fail}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 8
            periodSeconds: 3
            failureThreshold: 2
