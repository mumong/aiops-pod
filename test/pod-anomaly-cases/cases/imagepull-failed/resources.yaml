apiVersion: v1
kind: Namespace
metadata: {name: aiops-case-02}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload
  labels: {aiops.lab/case-id: c02}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: workload}
  template:
    metadata:
      labels: {app.kubernetes.io/name: workload, aiops.lab/case-id: c02}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: registry.invalid/aiops/workload:missing
          imagePullPolicy: Always
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
