apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-code
data:
  server.py: |
    import json
    import os
    import secrets
    import threading
    import time
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    MAX_BODY_BYTES = 65536
    STATE = {
        "requests": 0,
        "errors": 0,
        "duration_ms_total": 0.0,
        "allocated_mib": 0,
        "started_at": time.time(),
    }
    ALLOCATIONS = []

    def now_ns():
        return time.time_ns()

    def context(headers):
        raw = headers.get("traceparent", "")
        parts = raw.split("-")
        if len(parts) == 4 and len(parts[1]) == 32 and len(parts[2]) == 16:
            try:
                int(parts[1] + parts[2], 16)
                return parts[1].lower(), secrets.token_hex(8)
            except ValueError:
                pass
        return secrets.token_hex(16), secrets.token_hex(8)

    def attr(key, value):
        field = "boolValue" if isinstance(value, bool) else "intValue" if isinstance(value, int) else "stringValue"
        return {"key": key, "value": {field: value}}

    def export_span(trace_id, span_id, parent_span_id, status, started, ended, case_run_id):
        endpoint = os.getenv("OTLP_HTTP_ENDPOINT", "http://lgtm.monitor.svc:4318/v1/traces")
        pod = os.getenv("POD_NAME", "unknown")
        service = os.getenv("OTEL_SERVICE_NAME", "aiops-lab-workload")
        mode = os.getenv("FAILURE_MODE", "normal")
        payload = {
            "resourceSpans": [{
                "resource": {"attributes": [attr("service.name", service), attr("k8s.pod.name", pod),
                                               attr("k8s.namespace.name", os.getenv("POD_NAMESPACE", "unknown")),
                                               attr("aiops.case_run_id", case_run_id)]},
                "scopeSpans": [{"scope": {"name": "aiops-lab"}, "spans": [{
                    "traceId": trace_id, "spanId": span_id, "parentSpanId": parent_span_id,
                    "name": "GET /work", "kind": 2,
                    "startTimeUnixNano": str(started), "endTimeUnixNano": str(ended),
                    "attributes": [attr("http.request.method", "GET"), attr("http.route", "/work"),
                                   attr("http.response.status_code", status), attr("aiops.observed_mode", mode)],
                    "status": {"code": 2 if status >= 500 else 1}
                }]}]
            }]
        }
        request = urllib.request.Request(endpoint, data=json.dumps(payload).encode(),
                                         headers={"Content-Type": "application/json"}, method="POST")
        try:
            with urllib.request.urlopen(request, timeout=1.5):
                pass
        except Exception as exc:
            print(json.dumps({"timestamp": time.time(), "event": "otlp_export", "level": "warning",
                              "message": type(exc).__name__, "trace_id": trace_id}, separators=(",", ":")), flush=True)

    def exit_later(code):
        timer = threading.Timer(0.2, lambda: os._exit(code))
        timer.daemon = True
        timer.start()

    class Handler(BaseHTTPRequestHandler):
        server_version = "aiops-lab"

        def log_message(self, *_args):
            return

        def send_text(self, status, body, content_type="application/json"):
            encoded = body.encode()
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(encoded)))
            self.end_headers()
            self.wfile.write(encoded)

        def do_POST(self):
            size = min(int(self.headers.get("content-length", "0") or 0), MAX_BODY_BYTES)
            if size:
                self.rfile.read(size)
            self.do_GET()

        def do_GET(self):
            if self.path == "/metrics":
                lines = [
                    "# TYPE aiops_lab_requests_total counter",
                    f"aiops_lab_requests_total {STATE['requests']}",
                    "# TYPE aiops_lab_errors_total counter",
                    f"aiops_lab_errors_total {STATE['errors']}",
                    "# TYPE aiops_lab_duration_ms_total counter",
                    f"aiops_lab_duration_ms_total {STATE['duration_ms_total']}",
                    "# TYPE aiops_lab_allocated_mib gauge",
                    f"aiops_lab_allocated_mib {STATE['allocated_mib']}",
                ]
                return self.send_text(200, "\n".join(lines) + "\n", "text/plain; version=0.0.4")
            mode = os.getenv("FAILURE_MODE", "normal")
            if self.path == "/ready":
                return self.send_text(503 if mode == "readiness_fail" else 200, '{"ready":false}' if mode == "readiness_fail" else '{"ready":true}')
            if self.path == "/health":
                failed = mode == "liveness_fail" and STATE["requests"] >= 3
                return self.send_text(500 if failed else 200, '{"healthy":false}' if failed else '{"healthy":true}')
            if self.path != "/work":
                return self.send_text(404, '{"error":"not_found"}')

            started = now_ns()
            STATE["requests"] += 1
            status, level, message = 200, "info", "request completed"
            pending_exit = 0
            if mode == "runtime_exit" and STATE["requests"] >= 2:
                status, level, message = 500, "error", "runtime process exiting"
                pending_exit = 2
            elif mode == "config_missing_exit":
                status, level, message = 500, "error", "CONFIG_MISSING"
                if STATE["requests"] >= 3:
                    pending_exit = 78
            elif mode == "oom_growth":
                step = max(1, int(os.getenv("OOM_STEP_MIB", "8")))
                ALLOCATIONS.append(bytearray(step * 1024 * 1024))
                STATE["allocated_mib"] += step
                message = "memory allocation advanced"
            elif mode == "readiness_fail":
                status, level, message = 503, "error", "dependency unavailable"
            if status >= 500:
                STATE["errors"] += 1
            ended = now_ns()
            duration_ms = (ended - started) / 1_000_000
            STATE["duration_ms_total"] += duration_ms
            trace_id, span_id = context(self.headers)
            parent = self.headers.get("traceparent", "").split("-")[2] if len(self.headers.get("traceparent", "").split("-")) == 4 else ""
            case_run_id = self.headers.get("x-aiops-case-run-id", "unknown")[:128]
            log = {"timestamp": time.time(), "event": "http_request", "level": level, "message": message,
                   "http_status": status, "path": "/work", "duration_ms": duration_ms,
                   "case_run_id": case_run_id, "trace_id": trace_id, "span_id": span_id,
                   "pod": os.getenv("POD_NAME", "unknown"), "service": os.getenv("OTEL_SERVICE_NAME", "aiops-lab-workload"),
                   "allocated_mib": STATE["allocated_mib"]}
            print(json.dumps(log, separators=(",", ":")), flush=True)
            export_span(trace_id, span_id, parent, status, started, ended, case_run_id)
            self.send_text(status, json.dumps({"status": status, "trace_id": trace_id, "allocated_mib": STATE["allocated_mib"]}))
            if pending_exit:
                exit_later(pending_exit)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
  driver.py: |
    import json
    import os
    import secrets
    import time
    import urllib.request

    target = os.getenv("TARGET_URL", "http://workload:8080/work")
    run_id = os.environ["CASE_RUN_ID"]
    while True:
        trace_id = secrets.token_hex(16)
        parent_span_id = secrets.token_hex(8)
        request = urllib.request.Request(target, headers={
            "traceparent": f"00-{trace_id}-{parent_span_id}-01",
            "x-aiops-case-run-id": run_id,
        })
        status = 0
        try:
            with urllib.request.urlopen(request, timeout=1.8) as response:
                status = response.status
                response.read(65536)
        except Exception as exc:
            status = getattr(exc, "code", 0)
        print(json.dumps({"timestamp": time.time(), "event": "traffic_result", "http_status": status,
                          "trace_id": trace_id, "case_run_id": run_id}, separators=(",", ":")), flush=True)
        time.sleep(2)
