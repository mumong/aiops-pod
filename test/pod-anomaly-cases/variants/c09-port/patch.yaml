{
  "apiVersion": "v1",
  "kind": "Pod",
  "spec": {
    "containers": [
      {
        "name": "app",
        "resources": {
          "limits": {
            "memory": "64Mi",
            "cpu": "200m"
          }
        },
        "command": [
          "python3",
          "-u",
          "-c",
          "from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nimport time\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        if self.path == '/health': time.sleep(3)\n        self.send_response(200)\n        self.end_headers()\n        try: self.wfile.write(b'ok')\n        except BrokenPipeError: pass\nprint('listening on 18080', flush=True)\nThreadingHTTPServer(('0.0.0.0',18080),Handler).serve_forever()\n"
        ],
        "readinessProbe": {
          "httpGet": {
            "path": "/ready",
            "port": 18081
          },
          "initialDelaySeconds": 5,
          "periodSeconds": 5,
          "timeoutSeconds": 1,
          "failureThreshold": 1
        }
      }
    ]
  },
  "metadata": {
    "name": "workload",
    "labels": {
      "aiops.lab/case-id": "v16"
    }
  }
}
