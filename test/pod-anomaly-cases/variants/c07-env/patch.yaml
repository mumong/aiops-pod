{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "workload",
    "labels": {
      "aiops.lab/case-id": "v10"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "command": [
          "python3",
          "-u",
          "-c",
          "import os, sys; value = os.getenv('APP_REQUIRED_CONFIG'); print('APP_REQUIRED_CONFIG environment variable is missing' if value is None else 'configuration loaded', flush=True); sys.exit(78 if value is None else 0)"
        ]
      }
    ]
  }
}
