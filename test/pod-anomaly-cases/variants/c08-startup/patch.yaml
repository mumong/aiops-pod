{
  "apiVersion": "v1",
  "kind": "Pod",
  "spec": {
    "containers": [
      {
        "name": "app",
        "resources": {
          "limits": {
            "memory": "64Mi",
            "cpu": "100m"
          }
        },
        "command": [
          "python3",
          "-u",
          "-c",
          "import time; print('startup allocation 256Mi', flush=True); memory=bytearray(256*1024*1024); time.sleep(86400)"
        ]
      }
    ]
  },
  "metadata": {
    "name": "workload",
    "labels": {
      "aiops.lab/case-id": "v15"
    }
  }
}
