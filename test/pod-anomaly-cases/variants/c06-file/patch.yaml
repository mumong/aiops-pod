{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "workload",
    "labels": {
      "aiops.lab/case-id": "v09"
    }
  },
  "spec": {
    "volumes": [
      {
        "name": "input",
        "emptyDir": {
          "sizeLimit": "1Mi"
        }
      }
    ],
    "containers": [
      {
        "name": "app",
        "command": [
          "python3",
          "-u",
          "-c",
          "from pathlib import Path; print(Path('/input/app.conf').read_text())"
        ],
        "volumeMounts": [
          {
            "name": "input",
            "mountPath": "/input",
            "readOnly": true
          }
        ]
      }
    ]
  }
}
