apiVersion: v1
kind: Namespace
metadata: {name: aiops-manual-02}
---
apiVersion: v1
kind: Pod
metadata:
  name: workload
  namespace: aiops-manual-02
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: REPLACE_WITH_DISPOSABLE_NODE
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: xnet.registry.io:8443/observability/busybox:1.36
      command: ["sh", "-c", "while true; do date -u; sleep 5; done"]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
