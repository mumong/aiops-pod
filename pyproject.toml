[tool.ruff]
target-version = "py312"
line-length = 99
# tests/cases and tests/quality are imported tooling, not held to lint/format (as before they moved under tests/).
extend-exclude = [".venv-quality", "tests/quality/reports", "tests/cases", "tests/quality", "reports", "holmes"]

[tool.ruff.lint]
# Correctness and real bug patterns; line length is not enforced by lint.
# E9 syntax, F pyflakes, I import order, B bugbear.
select = ["E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Public re-export modules: imports are the API.
"app/core/prompts.py" = ["F401"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "a2a_adapter", "aiops_edge", "scripts"]

[tool.pytest.ini_options]
# Bare `pytest` runs the automated regression suite (same as `make test-unit`).
# tests/a2a (own venv), tests/cases, tests/quality and tests/acceptance run on request.
testpaths = ["tests/unit"]
