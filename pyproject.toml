[tool.ruff]
target-version = "py312"
line-length = 99
extend-exclude = [".venv-quality", "testreports", "reports", "holmes"]

[tool.ruff.lint]
# Correctness and real bug patterns; line length is not enforced by lint.
# E9 syntax, F pyflakes, I import order, B bugbear.
select = ["E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Public re-export modules: imports are the API.
"app/core/prompts.py" = ["F401"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "a2a_adapter", "a2a_test_agent", "tools", "aiops_edge"]

[tool.pytest.ini_options]
# Bare `pytest` runs the automated regression suite (same as `make test-unit`).
# test/ holds fault-injection and live evaluation tools, collected only on request.
testpaths = ["tests/unit", "test/workflow/test_runbook_remediation_guidance.py"]
