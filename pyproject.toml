[tool.ruff]
target-version = "py312"
line-length = 99
extend-exclude = [".venv-quality", "testreports", "reports", "holmes"]

[tool.ruff.lint]
# Correctness first; existing style debt is not hidden by blanket file ignores.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
# Bare `pytest` runs the automated regression suite (same as `make test-unit`).
# test/ holds fault-injection and live evaluation tools, collected only on request.
testpaths = ["tests/unit", "test/workflow/test_runbook_remediation_guidance.py"]
