# AIOps on the CENTER of the three-cluster test env (docs/specs/008-multi-cluster).
# Rendered by `make deploy-mc`. The ConfigMap aiops-config comes from
# deploy/configmap/config.yaml with deploy-edge/center/overrides.yaml merged in.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../deploy/rbac.yaml
  - ../../deploy/k8s-simple.yaml
  - ../../deploy/configmap/runbooks.yaml
patches:
  - path: deployment-patch.yaml
