apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-copilot
  namespace: aiops
spec:
  template:
    spec:
      containers:
        - name: aiops-copilot
          env:
            - name: AIOPS_CLUSTERS_CONFIG
              value: /etc/aiops-clusters/clusters.yaml
          volumeMounts:
            - {name: aiops-clusters, mountPath: /etc/aiops-clusters, readOnly: true}
            - {name: aiops-xnet, mountPath: /etc/aiops-xnet, readOnly: true}
            - {name: aiops-edge-key, mountPath: /etc/aiops-edge-key, readOnly: true}
      volumes:
        - name: aiops-clusters
          configMap: {name: aiops-clusters}
        - name: aiops-xnet
          secret: {secretName: aiops-xnet-client-cert, defaultMode: 0440}
        - name: aiops-edge-key
          secret: {secretName: aiops-edge-key, defaultMode: 0440}
