# 多集群配置（中心的 MCP 和 AIOps 挂载为 ConfigMap aiops-clusters，make mc-init 写入）。
# 不含任何凭据和边缘 API Server 地址：边缘只经 xnet 隧道和我们的边缘 runner 访问。
# 每套环境的集群不同，只需改 ### 标出的两处，其余保持不变。
clusters:
  ### 替换开始：在中心执行 make mc-discover，用输出中两行 ### 之间的内容整段替换这里 ###
  default: null
  center: <中心的 xnet 虚拟 Node 名>
  items:
    - name: <虚拟 Node 名>
      aliases: [<别名>]
      access: local
      observability: efk
  ### 替换结束 ###
  access:
    xnet:
      proxy_url: https://xnet-management.xnet.svc:9090/proxy
      runner_url: http://aiops-edge-runner.aiops.svc:8090
      cert_file: /etc/aiops-xnet/cert.pem
      key_file: /etc/aiops-xnet/key.pem
      ca_file: /etc/aiops-xnet/ca.pem
      signing_key_file: /etc/aiops-edge-key/key
      per_cluster_concurrency: 4
      call_timeout_seconds: 15

# 每个集群的 observability 选一个档案（make mc-discover OBS=efk|victoria）。档案里声明了 cluster_label /
# cluster_field 的后端存着所有集群的数据，MCP 每次查询都按集群名过滤，所以集群名必须等于可观测数据里的
# cluster 值（observability 部署时的 global.cluster = xnet 虚拟 Node 名）。
observability_profiles:
  ### 核对：中心可观测组件的 Service 地址（下面是 observability / vm 两个 release 装在命名空间 monitor 时的地址）###
  # efk：observability 仓库的多集群部署（multicluster/values-center.yaml / values-edge.yaml）。
  #   指标：中心 Prometheus，PromQL 注入 cluster 标签；日志：中心 ES 的 cluster 字段（容器日志）；
  #   链路：中心 DeepFlow，按每侧的 pod_cluster 过滤。ES / ClickHouse 经 MCP 的 AIOPS_ES_* / AIOPS_CLICKHOUSE_*
  #   （默认命名空间 monitor）在中心访问。
  efk:
    metrics: {type: prometheus, url: "http://observability-prometheus.monitor.svc:9090", cluster_label: cluster}
    logs: {type: elasticsearch, cluster_field: cluster}
    traces: {type: deepflow, cluster_field: pod_cluster}
  # victoria：VictoriaMetrics K8s Stack 的中心 / 边缘部署（日志只有 K8s 事件，没有链路）。
  victoria:
    metrics: {type: victoriametrics, url: "http://vmselect-vm-victoria-metrics-k8s-stack.monitor.svc:8481/select/0/prometheus", cluster_label: cluster}
    logs: {type: victorialogs_events, url: "http://vlsingle-vm-victoria-metrics-k8s-stack.monitor.svc:9428", cluster_field: cluster}
    traces: {type: none}
  ### 核对结束 ###

# 运维声明的「看着异常、实际正常」状态（app/core/workflow/expected_states.py）。只有实时数据吻合时才排除：
# Pod 属于该工作负载、处于 Running、只是 readiness 不通过，且 healthy_when 成立。下面这条是 xnet 中心固有的，保留即可。
expected_states:
  - cluster: center
    namespace: xnet
    workload: Deployment/xnet-management
    reason: xnet-management 主备选举，同一时间只有 1 个副本 Ready，其余副本 0/1 Running 属于正常
    healthy_when: {ready_replicas_min: 1}
