# Runner level 3: administrator, same as the center's MCP identity. Commands are
# still gated by the command rules, the pre-approval dry run and human approval.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-edge-runner-read-l3
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-edge-runner-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiops-edge-runner-read-l3
subjects:
  - {kind: ServiceAccount, name: aiops-edge-runner, namespace: aiops}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-edge-runner-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - {kind: ServiceAccount, name: aiops-edge-runner-writer, namespace: aiops}
