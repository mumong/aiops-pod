# aiops-edge-runner (docs/specs/008-multi-cluster). Applied in each EDGE cluster by
# `make edge-deploy`, never by `make deploy` (this directory is outside deploy/).
# The ConfigMap aiops-edge-runner-policy and Secret aiops-edge-key are created by
# the Makefile from the center's workflow.remediation rules and the ops key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-edge-runner
  namespace: aiops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-edge-runner-writer
  namespace: aiops
---
# Long-lived token of the writer identity, mounted only into the runner.
apiVersion: v1
kind: Secret
metadata:
  name: aiops-edge-runner-writer-token
  namespace: aiops
  annotations:
    kubernetes.io/service-account.name: aiops-edge-runner-writer
type: kubernetes.io/service-account-token
---
# Permissions: deploy-edge/rbac/level-<1|2|3>.yaml, chosen by `make edge-deploy RUNNER_LEVEL=…` (default 2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-edge-runner
  namespace: aiops
  labels:
    app: aiops-edge-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-edge-runner
  template:
    metadata:
      labels:
        app: aiops-edge-runner
    spec:
      serviceAccountName: aiops-edge-runner
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: runner
          image: xnet.registry.io:8443/xnet-cloud/aiops-edge-runner:1.0.0
          imagePullPolicy: Always
          env:
            - {name: RUNNER_LEVEL, value: "2"}   # replaced by make edge-deploy RUNNER_LEVEL=…
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: policy, mountPath: /etc/aiops-edge-runner, readOnly: true}
            - {name: key, mountPath: /etc/aiops-edge-key, readOnly: true}
            - {name: writer, mountPath: /etc/aiops-edge-writer, readOnly: true}
            - {name: state, mountPath: /var/lib/aiops-edge-runner}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: policy
          configMap: {name: aiops-edge-runner-policy}
        - name: key
          secret: {secretName: aiops-edge-key, defaultMode: 0440}
        - name: writer
          secret: {secretName: aiops-edge-runner-writer-token, defaultMode: 0440}
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-edge-runner
  namespace: aiops
spec:
  type: ClusterIP
  selector:
    app: aiops-edge-runner
  ports:
    - name: http
      port: 8090
      targetPort: http
