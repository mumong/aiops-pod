# Independent A2A Agent used to verify a real Agent -> Agent -> AIOps chain.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-a2a-test-agent
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-a2a-test-agent
  template:
    metadata:
      labels:
        app: aiops-a2a-test-agent
    spec:
      containers:
        - name: a2a-test-agent
          image: xnet.registry.io:8443/xnet-cloud/aiops-a2a-test-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: a2a-test
              containerPort: 8002
          env:
            # Discovery starts through the stable in-cluster Service. The operations
            # Agent Card itself publishes the NodePort/gateway URL configured by Make.
            - name: TEST_AGENT_TARGET_URL
              value: "http://aiops-copilot.aiops.svc.cluster.local:8001"
            - name: TEST_AGENT_TARGET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: A2A_API_TOKEN
                  optional: true
            # make deploy rewrites this to http://<first-node-internal-ip>:30802.
            # Override A2A_TEST_AGENT_PUBLIC_URL when a gateway/domain is preferred.
            - name: TEST_AGENT_PUBLIC_URL
              value: "http://127.0.0.1:8002"
            - name: TEST_AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: A2A_TEST_AGENT_API_TOKEN
                  optional: true
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: LOG_LEVEL
                  optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: a2a-test
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: a2a-test
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: aiops-a2a-test-agent
  namespace: aiops
spec:
  selector:
    app: aiops-a2a-test-agent
  ports:
    - name: a2a-test
      port: 8002
      targetPort: 8002
      nodePort: 30802
  type: NodePort
