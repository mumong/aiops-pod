# ============================================================================
# ConfigMap - 应用配置文件
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
data:
  config.yaml: |
    # LLM 提供商配置
    llm:
      model: "deepseek/deepseek-chat"

    # 内置工具集配置（Built-in Toolsets）
    # 策略：只保留 MCP 无法替代的内置功能，其余全部关闭
    # 所有 K8s/Helm/Bash/Prometheus/网络工具由外部 MCP Server 提供
    toolsets:
      # 保留：任务分解与规划（MCP 无此功能）
      core_investigation:
        enabled: true
      # 保留：Runbook 知识库（MCP 无此功能）
      runbook:
        enabled: true
      # 关闭：由 MCP bash_tool 替代
      bash:
        enabled: false
      # 关闭：由 MCP k8s-mcp-service 替代
      kubernetes/core:
        enabled: false
      # 关闭：由 MCP helmcharts 替代
      helm/core:
        enabled: false
      # 关闭：由 MCP prometheus_tool 替代
      kubernetes/kube-prometheus-stack:
        enabled: false
      # 关闭：由 MCP internete 替代
      internet:
        enabled: false
      # 关闭：由 MCP connectivity_check_tool 替代
      connectivity_check:
        enabled: false
      # 关闭：由 MCP prometheus_tool 替代
      prometheus/metrics:
        enabled: false
      # 关闭：不需要
      kubernetes/logs:
        enabled: true


    # 第三方 MCP 服务器配置（主力工具，全部启用）
    mcp_servers:
      k8s-mcp-service:
        description: "K8s MCP - kubectl get/describe/logs/events 等"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8093/sse"
          mode: "sse"
        enabled: true

      helmcharts:
        description: "Helm MCP - helm list/status/values 等"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8092/sse"
          mode: "sse"
        enabled: true

      bash_tool:
        description: "Bash MCP - 执行 bash 命令"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8094/sse"
          mode: "sse"
        enabled: true

      prometheus_tool:
        description: "Prometheus MCP - PromQL 查询"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8095/sse"
          mode: "sse"
        enabled: true

      # elasticsearch:
      #   description: "Elasticsearch MCP - 查询索引、搜索日志"
      #   config:
      #     url: "http://mcp-server-manager.mcp.svc.cluster.local:8088/sse"
      #     mode: "sse"
      #   enabled: true

      internete:
        description: "Internet MCP - 网页抓取"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8096/sse"
          mode: "sse"
        enabled: true

      connectivity_check_tool:
        description: "TCP 连通性检查"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8097/sse"
          mode: "sse"
        enabled: true

    # 工作流配置
    workflow:
      max_steps:
        layer: 3
        evidence: 10
        rca: 8
        conclusion: 3

    # 质量指标配置
    metrics:
      thresholds:
        mttr_seconds: 600
        rca_confidence: 0.8
        evidence_completeness: 0.9
      confidence_dimensions:
        evidence_strength:
          weight: 0.35
          description: "加权证据完整率"
        causal_chain:
          weight: 0.20
          description: "因果链完整性"
        tool_coverage:
          weight: 0.10
          description: "关键探针覆盖率"
        runbook_match:
          weight: 0.15
          description: "Runbook 匹配质量"
        llm_self_score:
          weight: 0.20
          description: "LLM 自评分数"
      penalties:
        critical_missing: 0.15
        critical_missing_cap: 0.45
        fallback_applied: 0.05
      evidence_level_weights:
        CRITICAL: 1.0
        IMPORTANT: 0.6
        SUPPLEMENTARY: 0.3
      baseline:
        with_evidence: 0.80
        with_root_cause: 0.75

    # 联邦查询配置
    federation:
      enabled: true
      max_tokens_per_agent: 0
      synthesis_timeout: 300
      sub_agents:
        - name: "main"
          url: "http://localhost:8000"
          description: "主集群"
          enabled: true
        - name: "cluster-24"
          url: "http://10.2.0.24:30800"
          description: "被管集群 10.2.0.24"
          enabled: true
