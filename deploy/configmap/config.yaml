# ============================================================================
# ConfigMap - 应用配置文件
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
data:
  config.yaml: |
    # ========================================================================
    # AIOps Copilot Runtime Config
    # ========================================================================
    # 常用修改入口:
    # 1. 模型思考开关: llm.extra_body.chat_template_kwargs.enable_thinking
    # 2. MCP 工具开关: mcp_servers.<server>.enabled
    # 3. 诊断节点开关/步数: workflow.nodes / workflow.max_steps
    # 4. 修复执行方式: workflow.remediation
    # 5. 流式输出和上下文压缩: workflow.think_stream / workflow.context_compaction
    # 6. 质量指标和联邦查询: metrics / federation
    #
    # 修复模式快速参考:
    # - workflow.remediation.executor=deterministic:
    #   按 conclusion JSON 中的 dry_run/execute/verify 命令顺序执行，速度快。
    # - workflow.remediation.executor=react:
    #   LLM 根据真实 observation 多轮决策，适合“命令执行后仍未恢复”的闭环修复。
    # - workflow.remediation.mode=review:
    #   plan 和每个写动作都需要人工 approve。
    # - workflow.remediation.mode=auto:
    #   自动执行，适合 e2e 或受控实验环境，生产谨慎开启。
    # 旧环境变量和请求参数 remediate 不再控制修复执行。

    # ------------------------------------------------------------------------
    # 1. LLM / Model Transport
    # ------------------------------------------------------------------------
    # LLM 连接与模型容量配置只从 Secret/Env 注入：
    # LLM_API_KEY / LLM_MODEL / LLM_API_BASE / MODEL_CONTEXT_WINDOW /
    # AIOPS_TOKENIZER_JSON_PATH / AIOPS_TIKTOKEN_ENCODING
    # ConfigMap 不再放默认模型，避免与 Secret 产生双配置冲突。
    llm:
      # Provider-specific OpenAI-compatible request options.
      # Qwen3 local inference can otherwise spend minutes emitting `<think>`
      # before each tool call. This is model transport control, not workflow
      # business logic.
      extra_body: {}  # DeepSeek；Qwen 专属 chat_template_kwargs 不跨供应商发送
      # 各类调用的输出 token 预留（发送为 max_tokens；输入仍受上下文窗口门禁约束）。
      # 环境变量 AICALL_MAX_OUTPUT_TOKENS / AICALL_DELIVERY_MAX_OUTPUT_TOKENS /
      # AICALL_COMPACTION_MAX_OUTPUT_TOKENS / AICALL_DELIVERY_RETRY_MULTIPLIER 可覆盖单项。
      output_tokens:
        agent: 6000         # 工具循环中的单轮模型输出（推理 + 回答 + 工具调用）
        delivery: 10000     # 无工具的结构化交付（RCA / 总结报告）；实测 6000 会被小模型的长报告撑满
        compaction: 3000    # 上下文压缩与摘要
        router: 1200        # 意图路由（RequestContract 分类，内部调用、不带 thinking）
      # 这些节点的 agent 工具循环按 internal_extra_body 发出（Qwen：不带 thinking，instruct 采样）。
      # 模型仍然选工具、读数、作答，只是不再在每轮前输出长推理。快速查询先开启观察；
      # 深度诊断节点（layer/evidence/remediation）保持 thinking。置为 [] 即全部恢复 thinking。
      no_thinking_nodes: [query_collect]
      # 工具循环的确定性护栏（环境变量 AICALL_MAX_TOOL_CALLS_PER_TURN / AICALL_MAX_IDENTICAL_CALLS 可覆盖）
      agent_guards:
        max_tool_calls_per_turn: 16   # 单条模型消息最多执行的工具调用数，0 不限
        max_identical_calls: 3        # 同一调用（工具+参数）在一个阶段内最多重复次数，到达后提示立即交付
        retry_multiplier: 2 # 交付返回空时，重试一次的预留倍数（受窗口剩余空间约束）
      # 仅用于内部调用（上下文压缩/摘要、结构化收卷），不影响面向用户的推理流。
      # 推理模型的 thinking 会挤占内部调用有限的 max_tokens，导致"摘要输出被截断"。
      # 已验证：Qwen3.8-27B(LiteLLM) 生效；gpt-6-luna(CPA) 忽略该字段。
      # 切换到拒绝未知字段的供应商时置为 {}。
      # 采样参数取 Qwen3.6 官方模型卡非思考（instruct）模式推荐值：temperature 0.7 / top_p 0.8 / top_k 20
      # （https://huggingface.co/Qwen/Qwen3.6-27B）。刻意不设 presence_penalty=1.5：内部调用产出结构化 JSON，
      # 键名/引号天然重复，惩罚可能扭曲输出；官方亦提示其可能导致语言混杂。gpt-6-luna(CPA) 已验证兼容。
      internal_extra_body:
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.8
        top_k: 20

    # ------------------------------------------------------------------------
    # 2. Language / i18n
    # ------------------------------------------------------------------------
    # i18n 配置 控制提示词和输出形式是中文zh还是英文en
    i18n:
      prompt_language: zh
      response_language: zh

    # ------------------------------------------------------------------------
    # 3. Tooling / MCP Servers
    # ------------------------------------------------------------------------
    # 内置工具集配置（全部关闭，所有能力由 MCP Server 提供）
    toolsets: {}

    # 第三方 MCP 服务器配置（主力工具，全部启用）
    mcp_servers:
      k8s-mcp-service:
        description: "K8s MCP - kubectl get/describe/logs/events/yaml/table 等只读资源查询"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8093/sse"
          mode: "sse"
        enabled: true

      helmcharts:
        description: "Helm MCP - helm list/status/values 等"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8092/sse"
          mode: "sse"
        enabled: false

      bash_tool:
        description: "Bash MCP - 执行 bash 命令"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8094/sse"
          mode: "sse"
        enabled: true

      prometheus_tool:
        description: "Query-only Prometheus MCP - 仅供 /query 的 node/cluster 通用 PromQL；/ask Pod 异常诊断必须使用 execute_pod_promql"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8095/sse"
          mode: "sse"
        enabled: true

      # ------------------------------------------------------------------------
      # AIOps 可观测 MCP - 自主组合查询，默认启用
      # Qwen 选择 Pod 级 PromQL、日志过滤条件和链路过滤条件。
      # ------------------------------------------------------------------------
      aiops-observability-query:
        description: "Pod 级自主可观测性查询 MCP - Qwen 按诊断目的组合 Prometheus、ES/Filebeat、DeepFlow/Tempo 查询"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8100/sse"
          mode: "sse"
        enabled: true

      # ------------------------------------------------------------------------
      # AIOps 可观测 MCP - 粗粒度兼容路径，默认关闭
      # ------------------------------------------------------------------------
      aiops-case-coarse:
        description: "AIOps Case MCP - 根据异常 Pod 实时采集 metrics/logs/traces/topology 并生成 case summary"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8089/sse"
          mode: "sse"
        enabled: false

      # ------------------------------------------------------------------------
      # AIOps 可观测 MCP - 细粒度工具，默认关闭，调试/专家模式使用
      # ------------------------------------------------------------------------
      aiops-observability-fine:
        description: "AIOps Fine MCP - 单独查询 Prometheus/ES/DeepFlow/K8s/topology 的 Pod 级观测工具"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8090/sse"
          mode: "sse"
        enabled: false
      
      core-investigation:
        description: "Core Investigation MCP - TodoWrite 任务分解与规划"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8098/sse"
          mode: "sse"
        enabled: true

      runbook:
        description: "Runbook MCP - 获取 Runbook 排障知识库"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8099/sse"
          mode: "sse"
        enabled: false

      internete:
        description: "Internet MCP - 网页抓取"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8096/sse"
          mode: "sse"
        enabled: false

      connectivity_check_tool:
        description: "TCP 连通性检查"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8097/sse"
          mode: "sse"
        enabled: false

    # ------------------------------------------------------------------------
    # 4. Diagnosis Workflow
    # ------------------------------------------------------------------------
    # 工作流配置
    workflow:
      # 节点启用/禁用（false 跳过该节点，conclusion 不可禁用）
      nodes:
        layer: true
        evidence: true
        rca: true
        conclusion: true

      # max_steps 直接作为 LangGraph recursion_limit，不做公式转换
      # recursion 包含模型/工具/中间件状态更新，不等于工具数量；保留有界退出。
      max_steps:
        query_collect: 48
        remediation: 64
        layer: 48   # 32 只够小模型约 11 轮（每轮约 3 个图步）；与 evidence/query_collect 一致
        evidence: 48
        rca: 0
        conclusion: 0

      # 结构化交付失败时是否允许回退到文本交付（layer/evidence/rca）。
      structured_runtime:
        fallback_enabled: true

      evidence:
        # Pod lane 扇出：每个待调查 Pod 使用同一独立 evidence + 正式 RCA 契约。
        # max_workers = 一次请求里同时运行的 Pod 诊断 agent（evidence + RCA lane）数，
        # 上限 16，超出的目标排队。每个 lane 是一条独立的模型请求流，容量边界是
        # vLLM 的并发/KV cache；当前 KV cache 占用很低，按 10 配置。
        # 环境变量 AIOPS_AUTONOMOUS_PARALLEL_WORKERS 仅在未配置时生效。
        parallel:
          enabled: true
          max_workers: 10

      # --------------------------------------------------------------------
      # 4.1 Post-Diagnosis Remediation
      # --------------------------------------------------------------------
      # 修复执行: executor=deterministic 固定执行计划；executor=react 由 LLM 多轮观察后决策。
      remediation:
        enabled: true
        executor: pod               # 通用 kubectl 执行；Agent 规划，按 mode 审阅，无故障专用脚本
        mode: review                 # review=人工审批；auto=自动执行
        # mode: auto
        approval_timeout_seconds: 600
        # 仅作用于 pod 修复执行器；deny 优先，支持命令名通配符。
        denied_executables: [rm]
        # kubectl exec/run/debug 的内层命令；shell 只接受可检查的字面量 -c。
        allowed_exec_commands: []    # 空列表关闭额外命令白名单，仍检查 denied_executables
        max_iterations: 10           # react 最大思考/观察轮次
        max_write_actions: 10        # react 最多执行多少个写动作
        max_duration_seconds: 900    # react 总耗时上限
        verify_settle_seconds: 5   # 写动作后等待再验证单位秒

      # --------------------------------------------------------------------
      # 4.2 Streaming / Context Control
      # --------------------------------------------------------------------
      # `<think>` 展示: full=完整展示；truncated=截断展示；hidden=隐藏。
      think_stream:
        # mode: hidden
        # mode: truncated
        mode: full
        max_chars: 1200

      # 工具输出摘要: rule=规则摘要；ai=额外 LLM 摘要，更慢。
      observation_summary:
        mode: rule
        max_chars: 3000

      # 上下文治理。模型窗口大小只有一个来源：Secret 的 MODEL_CONTEXT_WINDOW
      # （或 llm.context_window）。LLM 侧调整窗口（如 54K -> 128K）时只改那一处；
      # 下面都是比例或绝对预留量：
      #   - hard_guard_input_ratio：调用前输入上限 = 窗口 × 比例，再扣输出预留与安全余量
      #   - recent_keep_ratio / recent_keep_tokens：压缩时保留的近期完整交互 = min(两者)
      #   - llm.output_tokens：各类调用的输出预留（见上）
      #   - max_context_window：仅限制旧的"运行时轻量压缩"路径在多大的窗口内启用；
      #     当前 54K 已超过它，实际压缩由 WorkingContextMiddleware（hard guard）完成
      context_compaction:
        enabled: true
        nodes:
          - evidence
        max_context_window: 35000
        trigger_ratio: 0.70
        max_compactions_per_call: 1
        summary_max_tokens: 1200
        recent_keep_ratio: 0.15
        recent_keep_tokens: 8000
        hard_guard_enabled: true
        hard_guard_input_ratio: 0.90
        hard_guard_safety_tokens: 2000
        hard_guard_preserve_tail_tokens: 1200

    # ------------------------------------------------------------------------
    # 5. Quality Metrics
    # ------------------------------------------------------------------------
    # 质量指标配置
    metrics:
      enabled: false  # 是否在输出中显示质量指标（false 时只显示性能统计和诊断追踪）
      thresholds:
        mttr_seconds: 600
        rca_confidence: 0.8
        evidence_completeness: 0.9
      confidence_dimensions:
        evidence_strength:
          weight: 0.35
          description: "加权证据完整率"
        causal_chain:
          weight: 0.20
          description: "因果链完整性"
        tool_coverage:
          weight: 0.10
          description: "关键探针覆盖率"
        runbook_match:
          weight: 0.15
          description: "Runbook 匹配质量"
        llm_self_score:
          weight: 0.20
          description: "LLM 自评分数"
      penalties:
        critical_missing: 0.15
        critical_missing_cap: 0.45
        fallback_applied: 0.05
      evidence_level_weights:
        CRITICAL: 1.0
        IMPORTANT: 0.6
        SUPPLEMENTARY: 0.3
      baseline:
        with_evidence: 0.80
        with_root_cause: 0.75

    # ------------------------------------------------------------------------
    # 6. Federation
    # ------------------------------------------------------------------------
    # 联邦查询配置
    federation:
      enabled: true
      max_tokens_per_agent: 0
      synthesis_timeout: 300
      sub_agents:
        - name: "main"
          url: "http://localhost:8000"
          description: "主集群"
          enabled: true
        - name: "cluster-24"
          url: "http://10.2.0.24:30800"
          description: "被管集群 10.2.0.24"
          enabled: true
