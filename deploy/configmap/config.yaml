# ============================================================================
# ConfigMap - 应用配置文件
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
data:
  config.yaml: |
    # LLM 提供商配置
    llm:
      model: "deepseek/deepseek-chat"

    # i18n 配置 控制提示词和输出形式是中文zh还是英文en
    i18n:
      prompt_language: zh
      response_language: zh

    # 内置工具集配置（全部关闭，所有能力由 MCP Server 提供）
    toolsets: {}

    # 第三方 MCP 服务器配置（主力工具，全部启用）
    mcp_servers:
      k8s-mcp-service:
        description: "K8s MCP - kubectl get/describe/logs/events 等"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8093/sse"
          mode: "sse"
        enabled: true

      helmcharts:
        description: "Helm MCP - helm list/status/values 等"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8092/sse"
          mode: "sse"
        enabled: true

      bash_tool:
        description: "Bash MCP - 执行 bash 命令"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8094/sse"
          mode: "sse"
        enabled: true

      prometheus_tool:
        description: "Prometheus MCP - PromQL 查询"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8095/sse"
          mode: "sse"
        enabled: true
      
      core-investigation:
        description: "Core Investigation MCP - TodoWrite 任务分解与规划"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8098/sse"
          mode: "sse"
        enabled: true

      runbook:
        description: "Runbook MCP - 获取 Runbook 排障知识库"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8099/sse"
          mode: "sse"
        enabled: true

      internete:
        description: "Internet MCP - 网页抓取"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8096/sse"
          mode: "sse"
        enabled: true

      connectivity_check_tool:
        description: "TCP 连通性检查"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8097/sse"
          mode: "sse"
        enabled: true

    # 工作流配置
    workflow:
      # RCA 节点调用模式: lite(不带工具,避免重复) / full(原有全工具模式)
      rca_mode: lite
      # 节点启用/禁用（false 跳过该节点，conclusion 不可禁用）
      nodes:
        layer: true
        evidence: true
        rca: true
        conclusion: true

      # max_steps 直接作为 LangGraph recursion_limit，不做公式转换
      # 注意：LangGraph 每轮 model→tools 算 2 次 recursion，建议配置值 >= 预期工具调用数 * 2 + 5
      max_steps:
        layer: 28
        evidence: 30
        rca: 0
        conclusion: 0

    # 质量指标配置
    metrics:
      enabled: false  # 是否在输出中显示质量指标（false 时只显示性能统计和诊断追踪）
      thresholds:
        mttr_seconds: 600
        rca_confidence: 0.8
        evidence_completeness: 0.9
      confidence_dimensions:
        evidence_strength:
          weight: 0.35
          description: "加权证据完整率"
        causal_chain:
          weight: 0.20
          description: "因果链完整性"
        tool_coverage:
          weight: 0.10
          description: "关键探针覆盖率"
        runbook_match:
          weight: 0.15
          description: "Runbook 匹配质量"
        llm_self_score:
          weight: 0.20
          description: "LLM 自评分数"
      penalties:
        critical_missing: 0.15
        critical_missing_cap: 0.45
        fallback_applied: 0.05
      evidence_level_weights:
        CRITICAL: 1.0
        IMPORTANT: 0.6
        SUPPLEMENTARY: 0.3
      baseline:
        with_evidence: 0.80
        with_root_cause: 0.75

    # 联邦查询配置
    federation:
      enabled: true
      max_tokens_per_agent: 0
      synthesis_timeout: 300
      sub_agents:
        - name: "main"
          url: "http://localhost:8000"
          description: "主集群"
          enabled: true
        - name: "cluster-24"
          url: "http://10.2.0.24:30800"
          description: "被管集群 10.2.0.24"
          enabled: true
