# ============================================================================
# ConfigMap - 应用配置文件
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
data:
  config.yaml: |
    # 内置工具集配置（Built-in Toolsets）
    # 每个 toolset 下的工具列表见下方注释，便于学习与排查
    toolsets:
      # 核心：任务分解与规划 | 工具: TodoWrite
      core_investigation:
        enabled: true
      # 核心：Runbook 知识库 | 工具: fetch_runbook, runbook
      runbook:
        enabled: true
      # Bash 执行（有安全风险，按需启用）| 工具: run_bash_command, kubectl_run_image
      bash:
        enabled: true
      # K8s 只读：get/describe/events 等 | 工具: kubectl_describe, kubectl_get_by_name, kubectl_get_by_kind_in_namespace, kubectl_get_by_kind_in_cluster, kubectl_find_resource, kubectl_get_yaml, kubectl_events, kubernetes_jq_query, kubernetes_tabular_query, kubernetes_count, kubectl_top_pods, kubectl_top_nodes, get_prometheus_target, kubectl_lineage_children, kubectl_lineage_parents
      kubernetes/core:
        enabled: true
      # Helm 只读 | 工具: helm_list, helm_values, helm_status, helm_history, helm_manifest, helm_hooks, helm_chart, helm_notes
      helm/core:
        enabled: true
      # kube-prometheus-stack 相关 | 工具: get_prometheus_target
      kubernetes/kube-prometheus-stack:
        enabled: true
      # 网页抓取 | 工具: fetch_webpage, internet
      internet:
        enabled: true
      # TCP 连通性检查 | 工具: tcp_check
      connectivity_check:
        enabled: true
      # Prometheus 查询 | 工具: list_prometheus_rules, get_metric_names, get_label_values, get_all_labels, get_series, get_metric_metadata, execute_prometheus_instant_query, execute_prometheus_range_query
      prometheus/metrics:
        enabled: true
        config:
          prometheus_url: "http://observability-prometheus.xnet.svc:9090"
    
    # 第三方 MCP 服务器配置（Remote MCP Servers）
    # 使用完整的 Kubernetes FQDN 确保 DNS 解析可靠
    mcp_servers:
      test_tool_server:
        description: "测试工具集临时输出 - 只有当用户需要测试的时候才运行"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8091/sse"
          mode: "sse"
        llm_instructions: "只有当用户需要测试临时输出的时候才运行这个工具。"
        enabled: true  # 第一个测试
      
      elasticsearch:
        description: "Elasticsearch MCP 工具集 - 用于查询索引、搜索日志数据"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8088/sse"
          mode: "sse"
        enabled: true
      helmcharts:
        description: "Helm MCP 工具集 - 用于查询 Helm 资源"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8092/sse"
          mode: "sse"
        enabled: true
      
      k8s-mcp-service:
        description: "K8s MCP 工具集 - 用于查询 K8s 资源"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8093/sse"
          mode: "sse"
        enabled: true

      bash_tool:
        description: "bash的mcp工具，用于执行bash命令"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8094/sse"
          mode: "sse"
        enabled: true

      prometheus_tool:
        description: "prometheus的mcp工具，用于查询prometheus资源"      
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8095/sse"
          mode: "sse"
        enabled: true

      internete:
        description: "internet的mcp工具，用于查询internet资源"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8096/sse"
          mode: "sse"
        enabled: true

      connectivity_check_tool:
        description: "connectivity_check的mcp工具，用于查询connectivity_check资源"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8097/sse"
          mode: "sse"
        enabled: true

    # 联邦查询配置（多集群 Agent-to-Agent）
    # 主集群设 enabled: true，子集群设 enabled: false 或省略此块
    federation:
      enabled: true                 # 主集群部署时改为 true
      max_tokens_per_agent: 0     # 单个子集群报告超过此 token 数则压缩
      synthesis_timeout: 300           # 等待子集群响应的最大秒数
      sub_agents:
        - name: "cluster-24"
          url: "http://10.2.0.24:30800"
          description: "被管集群 10.2.0.24"
          enabled: true
