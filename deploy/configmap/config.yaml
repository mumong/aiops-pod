# ============================================================================
# ConfigMap - 应用配置文件
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
data:
  config.yaml: |
    # LLM 连接与模型容量配置只从 Secret/Env 注入：
    # LLM_API_KEY / LLM_MODEL / LLM_API_BASE / MODEL_CONTEXT_WINDOW /
    # AIOPS_TOKENIZER_JSON_PATH / AIOPS_TIKTOKEN_ENCODING
    # ConfigMap 不再放默认模型，避免与 Secret 产生双配置冲突。
    llm:
      # Provider-specific OpenAI-compatible request options.
      # Qwen3 local inference can otherwise spend minutes emitting `<think>`
      # before each tool call. This is model transport control, not workflow
      # business logic.
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
          # enable_thinking: true

    # i18n 配置 控制提示词和输出形式是中文zh还是英文en
    i18n:
      prompt_language: zh
      response_language: zh

    # 内置工具集配置（全部关闭，所有能力由 MCP Server 提供）
    toolsets: {}

    # 第三方 MCP 服务器配置（主力工具，全部启用）
    mcp_servers:
      k8s-mcp-service:
        description: "K8s MCP - kubectl get/describe/logs/events/yaml/table 等只读资源查询"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8093/sse"
          mode: "sse"
        enabled: true

      helmcharts:
        description: "Helm MCP - helm list/status/values 等"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8092/sse"
          mode: "sse"
        enabled: false

      bash_tool:
        description: "Bash MCP - 执行 bash 命令"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8094/sse"
          mode: "sse"
        enabled: true

      prometheus_tool:
        description: "Prometheus MCP - PromQL 查询"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8095/sse"
          mode: "sse"
        enabled: true
      
      core-investigation:
        description: "Core Investigation MCP - TodoWrite 任务分解与规划"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8098/sse"
          mode: "sse"
        enabled: true

      runbook:
        description: "Runbook MCP - 获取 Runbook 排障知识库"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8099/sse"
          mode: "sse"
        enabled: false

      internete:
        description: "Internet MCP - 网页抓取"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8096/sse"
          mode: "sse"
        enabled: false

      connectivity_check_tool:
        description: "TCP 连通性检查"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8097/sse"
          mode: "sse"
        enabled: false

    # 工作流配置
    workflow:
      # RCA 节点调用模式: lite(不带工具,避免重复) / full(原有全工具模式)
      rca_mode: lite
      # 节点启用/禁用（false 跳过该节点，conclusion 不可禁用）
      nodes:
        layer: true
        evidence: true
        rca: true
        conclusion: true

      # max_steps 直接作为 LangGraph recursion_limit，不做公式转换
      # 注意：LangGraph 每轮 model→tools 算 2 次 recursion，建议配置值 >= 预期工具调用数 * 2 + 5
      max_steps:
        layer: 15
        evidence: 20
        rca: 0
        conclusion: 0

      # 统一结构化运行时:
      # layer/evidence/rca 通过 Pydantic 产出机器可消费结构化结果；
      # conclusion 是面向人的最终 Markdown 报告，默认不走 Pydantic，避免模板遵循被 schema 削弱。
      structured_runtime:
        enabled: true
        fallback_enabled: true
        nodes:
          layer: true
          evidence: true
          rca: true
          conclusion: true

      # 节点动态提前停止开关:
      # layer=true: 有效结构化 JSON 被 AICall 捕获后可提前结束本轮 agent
      # evidence=true: critical/important 证据满足后 stop_checker 可提前结束采证
      # 如需对比复杂场景下工具采集充分性，可临时关闭对应节点早停。
      layer:
        # 使用 LangChain create_agent(response_format=LayerOutput)：
        # 工具调用和 LayerOutput Pydantic 结构化输出在同一次 agent loop 内完成。
        agent_structured_output: true
        # 仅当 OpenAI-compatible 网关不支持 agent response_format 时，降级为旧 layer_extract。
        extract_fallback: true
        early_stop:
          enabled: false
      evidence:
        # 使用 LangChain create_agent(response_format=EvidenceCollectionOutput)：
        # 计划生成、真实工具采证、结构化 evidence 输出在同一次 agent loop 内完成。
        agent_structured_output: true
        # 仅当 agent structured output 不可用时，降级为旧的 evidence_plan 预生成 + 执行模式。
        plan_precall_fallback: true
        early_stop:
          enabled: false

      conclusion:
        # diagnosis 默认使用 CONCLUSION_FORMATTER_PROMPT 纯文本 Markdown 输出。
        # 如需回到旧 ConclusionOutput 结构化路径，可显式设置 structured_output: true。
        structured_output: false
        # 这里控制不同模式的输出预算：QUERY 只需要短表格摘要，诊断保留完整报告空间。
        max_tokens:
          query: 1024
          diagnosis: 8192

      # 本地推理模型 `<think>` 
      # full=完整展示（默认） / truncated=只展示前 max_chars 字符 / hidden=不展示
      think_stream:
        # mode: hidden
        mode: full
        max_chars: 1200

      # 工具 observation 回注给主 Agent 前的摘要策略:
      # rule=默认，规则摘要优先，超长或上下文压力过高才调用 LLM 兜底
      # ai=每次工具返回都强制调用 LLM summarizer，再回注给主 Agent
      observation_summary:
        mode: rule
        max_chars: 3000

      # Evidence 运行时上下文压缩:
      # enabled=true 时，仅对 context_window <= max_context_window 的模型生效。
      # 当 evidence 当前估算上下文使用率达到 trigger_ratio 后，执行一次
      # Pydantic structured lite 压缩，将历史 ai_messages/tool_observations
      # 汇总为 context_summary，并保留 evidence_plan/tool_result 骨架供下游消费。
      context_compaction:
        enabled: true
        nodes:
          - evidence
        max_context_window: 35000
        trigger_ratio: 0.70
        max_compactions_per_call: 1
        summary_max_tokens: 1200

    # 质量指标配置
    metrics:
      enabled: false  # 是否在输出中显示质量指标（false 时只显示性能统计和诊断追踪）
      thresholds:
        mttr_seconds: 600
        rca_confidence: 0.8
        evidence_completeness: 0.9
      confidence_dimensions:
        evidence_strength:
          weight: 0.35
          description: "加权证据完整率"
        causal_chain:
          weight: 0.20
          description: "因果链完整性"
        tool_coverage:
          weight: 0.10
          description: "关键探针覆盖率"
        runbook_match:
          weight: 0.15
          description: "Runbook 匹配质量"
        llm_self_score:
          weight: 0.20
          description: "LLM 自评分数"
      penalties:
        critical_missing: 0.15
        critical_missing_cap: 0.45
        fallback_applied: 0.05
      evidence_level_weights:
        CRITICAL: 1.0
        IMPORTANT: 0.6
        SUPPLEMENTARY: 0.3
      baseline:
        with_evidence: 0.80
        with_root_cause: 0.75

    # 联邦查询配置
    federation:
      enabled: true
      max_tokens_per_agent: 0
      synthesis_timeout: 300
      sub_agents:
        - name: "main"
          url: "http://localhost:8000"
          description: "主集群"
          enabled: true
        - name: "cluster-24"
          url: "http://10.2.0.24:30800"
          description: "被管集群 10.2.0.24"
          enabled: true
