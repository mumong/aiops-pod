# ============================================================================
# ConfigMap - AIOps Copilot 运行配置
# ============================================================================
# 分类：1 模型调用  2 语言  3 工具(MCP)  4 诊断流程  5 修复与执行
#       6 输出与上下文  7 质量评分(旧，已关闭)  8 联邦查询
# 模型地址/密钥/窗口不在这里：Secret 中的 LLM_API_KEY / LLM_MODEL / LLM_API_BASE /
# MODEL_CONTEXT_WINDOW。改完本文件需重新部署（make release）；修复模式可用运行时开关临时覆盖。

apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
data:
  config.yaml: |
    # ------------------------------------------------------------------------
    # 1. 模型调用
    # ------------------------------------------------------------------------
    llm:
      extra_body: {}                # 面向用户的调用附加请求字段（空=不加）
      output_tokens:                # 各类调用的 max_tokens（环境变量 AICALL_*_MAX_OUTPUT_TOKENS 可覆盖）
        agent: 4000                 # 工具循环单轮；Qwen3.6 失控推理会打满，4000 把代价压到 ~70s
        delivery: 10000             # 无工具的结构化交付（RCA / 总结报告）
        compaction: 3000            # 上下文压缩与摘要
        router: 1200                # 意图路由
      no_thinking_nodes: []         # 关 thinking 的节点；Qwen3.6 工具循环关 thinking 会退化，保持为空
      history_reasoning_field: reasoning  # 工具循环内回传前几轮推理的字段（vLLM 0.19+Qwen3.6）；DeepSeek 置空
      structured_tool_choice: auto  # 结构化结果的调用方式；named 会触发 vLLM 约束解码，Qwen 引号转义出错
      loop_tool_choice:             # 工具循环每轮是否强制调工具：required=LangChain 默认强制；auto=允许以文本收尾，由收卷交付结构化结果
        default: required           #   字符串则全局生效；按节点：query_collect / layer / evidence / remediation
        query_collect: auto         #   轻量查询已验证：auto 下 0 重复、4/4 answered（required 3/4 partial）
      agent_guards:                 # 工具循环护栏（每个 Agent 阶段生效）
        max_tool_calls_per_turn: 16       # 单条模型消息最多执行的工具调用数，0 不限
        max_identical_calls: 3            # 同一调用（工具+参数）最多重复次数，超过即停止本阶段并交付
        repeat_page_chars: 3000           # 结果被截断时，重复调用依次返回原文下一段（0 关闭）
        finalize_on_idle_round: true      # 一整轮全是已返回过的调用时直接交付
        idle_round_min_calls: 2           # 少于此数的轮次不算空转
        structured_validation_retries: 2  # 结构化交付未通过校验时的重试次数
        runaway_round_retries: 1          # 一轮只思考、无工具无交付时的重试次数（0 关闭）
        retry_multiplier: 2               # 交付为空时重试的输出预留倍数
      internal_extra_body:          # 内部调用（压缩、收卷）专用：不带 thinking，Qwen 官方 instruct 采样参数
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.8
        top_k: 20

    # ------------------------------------------------------------------------
    # 2. 语言（zh / en）
    # ------------------------------------------------------------------------
    i18n:
      prompt_language: zh
      response_language: zh

    # ------------------------------------------------------------------------
    # 3. 工具：全部由 MCP Server 提供（内置工具集关闭）
    # ------------------------------------------------------------------------
    toolsets: {}
    mcp_servers:
      k8s-mcp-service:
        description: "K8s MCP - kubectl get/describe/logs/events/yaml/table 等只读资源查询"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8093/sse"
          mode: "sse"
        enabled: true
      helmcharts:                   # 执行请求（部署/升级/卸载 Release）与 helm 查询
        description: "Helm MCP - helm list/status/values/install/upgrade/uninstall/rollback"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8092/sse"
          mode: "sse"
        enabled: true
      bash_tool:
        description: "Bash MCP - 执行 bash 命令"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8094/sse"
          mode: "sse"
        enabled: true
      prometheus_tool:
        description: "Query-only Prometheus MCP - 仅供 /query 的 node/cluster 通用 PromQL；/ask Pod 异常诊断必须使用 execute_pod_promql"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8095/sse"
          mode: "sse"
        enabled: true
      aiops-observability-query:    # 主力：Pod 级 Prometheus / 日志 / 链路 / 拓扑自主查询
        description: "Pod 级自主可观测性查询 MCP - Qwen 按诊断目的组合 Prometheus、ES/Filebeat、DeepFlow/Tempo 查询"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8100/sse"
          mode: "sse"
        enabled: true
      aiops-case-coarse:            # 旧：粗粒度一次性采集
        description: "AIOps Case MCP - 根据异常 Pod 实时采集 metrics/logs/traces/topology 并生成 case summary"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8089/sse"
          mode: "sse"
        enabled: false
      aiops-observability-fine:     # 旧：细粒度单项查询（调试用）
        description: "AIOps Fine MCP - 单独查询 Prometheus/ES/DeepFlow/K8s/topology 的 Pod 级观测工具"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8090/sse"
          mode: "sse"
        enabled: false
      core-investigation:
        description: "Core Investigation MCP - TodoWrite 任务分解与规划"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8098/sse"
          mode: "sse"
        enabled: true
      runbook:                      # Runbook 已由内置 fetch_runbook 提供
        description: "Runbook MCP - 获取 Runbook 排障知识库"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8099/sse"
          mode: "sse"
        enabled: false
      internete:
        description: "Internet MCP - 网页抓取"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8096/sse"
          mode: "sse"
        enabled: false
      connectivity_check_tool:
        description: "TCP 连通性检查"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8097/sse"
          mode: "sse"
        enabled: false

    workflow:
      # ----------------------------------------------------------------------
      # 4. 诊断流程
      # ----------------------------------------------------------------------
      nodes:                        # 节点开关（conclusion 不可关）
        layer: true
        evidence: true
        rca: true
        conclusion: true
      max_steps:                    # 每个 Agent 的 LangGraph 步数上限（一轮工具调用约 3 步；0=不带工具）
        # 轻量路由（查询/执行）：线上 40 次运行里 p50=6 轮、p90=16 轮，超过 ~8 轮的运行几乎都以
        # partial 收场且耗时翻倍，重复/空转护栏通常更早结束；32 步≈10 轮作为兜底（2026-10-20）
        query_collect: 32
        remediation: 64
        layer: 48
        evidence: 48
        rca: 0
        conclusion: 0
      structured_runtime:
        fallback_enabled: true      # 结构化交付失败时允许回退到文本交付
      evidence:
        parallel:                   # 每个异常组一条独立 lane（取证 + 根因），修复规划共用该并发上限
          enabled: true
          max_workers: 10           # 同时运行的 lane 数（1–16），超出排队

      # ----------------------------------------------------------------------
      # 5. 修复与执行
      # ----------------------------------------------------------------------
      # 运行时开关：PUT /repair/policy/mode（请求头 X-AIOps-Admin-Token）可在 TTL 内覆盖
      # mode / approval_timeout_seconds，到期回到这里；GET /repair/policy 查看生效值。
      # 高危规则可用 POST /repair/policy/check {"commands":[...]} 干跑，不执行命令。
      remediation:
        enabled: true               # false：只出方案，不执行
        executor: pod               # 通用 kubectl 执行器
        mode: auto                  # review=每个动作人工审批；auto=自动执行（生产慎用）
        approval_timeout_seconds: 600   # review 下等待审批的时长，超时不执行
        max_duration_seconds: 900   # 单个任务整体时限（审批等待 + 命令），到时终态 timeout

        # 高危命令规则：只看命令形态，命中任一条即拒绝（blocked），不执行任何命令。
        # 2026-10-20 收窄为核心危险操作；delete/apply/patch/scale/rollout 等常规修复动作放行，
        # 仍受"只改本组对象及其控制器"的范围校验。容器内命令名单与 mcpstander bash 工具
        # 的 BASH_BLOCKED_COMMANDS 保持一致。
        denied_operations: [drain, taint, cp, port-forward, proxy, attach, auth, certificate, edit]
        denied_flags: [--all, --all-namespaces, -A]          # 批量参数
        bulk_selector_on_write: true    # 写操作带 -l / --selector / --field-selector 视为批量，拒绝
        denied_resource_kinds: [node, namespace, customresourcedefinition, persistentvolume, storageclass,
                                clusterrole, clusterrolebinding,
                                mutatingwebhookconfiguration, validatingwebhookconfiguration]  # 写这些资源拒绝，读不限
        denied_executables: [rm, dd, "mkfs*", fdisk, sfdisk, parted, wipefs, blkdiscard, shred,
                             shutdown, reboot, halt, poweroff]  # kubectl exec/run/debug 内层命令（支持通配符）
        allowed_exec_commands: []   # exec 内层命令白名单，空=不启用

        recovery:                   # 执行后的恢复观察（只读）：Pod Running+Ready 且无新增重启，或删除完成
          timeout_seconds: 180      # 超时仍未恢复 → not_recovered；0 关闭观察
          poll_seconds: 5
          settle_seconds: 20        # 达标后需稳定的秒数

      # ----------------------------------------------------------------------
      # 6. 输出与上下文
      # ----------------------------------------------------------------------
      think_stream:                 # 模型思考的展示：full / truncated / hidden
        mode: full
        max_chars: 1200             # truncated 模式下每段最多字符
      observation_summary:          # 工具结果给模型前的摘要：rule=规则摘要；ai=额外 LLM 摘要（更慢）
        mode: rule
        max_chars: 3000
      context_compaction:           # 上下文压缩：输入接近窗口上限时，较早历史整理成工作记忆
        enabled: true
        nodes:
          - evidence
        hard_guard_enabled: true
        hard_guard_input_ratio: 0.90      # 调用前输入上限 = 窗口 × 比例（再扣输出预留与余量）
        hard_guard_safety_tokens: 2000
        hard_guard_preserve_tail_tokens: 1200
        recent_keep_interactions: 2       # 压缩时原样保留最近几次完整交互
        recent_keep_ratio: 0.06           # 这些交互合计不超过窗口的比例（最新一次最多 15%）
        summary_output_ratio: 0.08        # 工作记忆输出预算占窗口的比例

    # ------------------------------------------------------------------------
    # 7. 质量评分（旧版加权置信度，已关闭；诊断可信度看每组结论的 certainty）
    # ------------------------------------------------------------------------
    metrics:
      enabled: false

    # ------------------------------------------------------------------------
    # 8. 联邦查询（/federation/ask，多集群）
    # ------------------------------------------------------------------------
    federation:
      enabled: true
      max_tokens_per_agent: 0
      synthesis_timeout: 300
      sub_agents:
        - name: "main"
          url: "http://localhost:8000"
          description: "主集群"
          enabled: true
        - name: "cluster-24"
          url: "http://10.2.0.24:30800"
          description: "被管集群 10.2.0.24"
          enabled: true
