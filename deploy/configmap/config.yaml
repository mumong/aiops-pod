# ============================================================================
# ConfigMap - 应用配置文件
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
data:
  config.yaml: |
    # ========================================================================
    # AIOps Copilot Runtime Config
    # ========================================================================
    # 常用修改入口:
    # 1. 模型思考开关: llm.extra_body.chat_template_kwargs.enable_thinking
    # 2. MCP 工具开关: mcp_servers.<server>.enabled
    # 3. 诊断节点开关/步数: workflow.nodes / workflow.max_steps
    # 4. 修复执行方式: workflow.remediation
    # 5. 流式输出和上下文压缩: workflow.think_stream / workflow.context_compaction
    # 6. 质量指标和联邦查询: metrics / federation
    #
    # 修复模式快速参考:
    # - workflow.remediation.executor=deterministic:
    #   按 conclusion JSON 中的 dry_run/execute/verify 命令顺序执行，速度快。
    # - workflow.remediation.executor=react:
    #   LLM 根据真实 observation 多轮决策，适合“命令执行后仍未恢复”的闭环修复。
    # - workflow.remediation.mode=review:
    #   plan 和每个写动作都需要人工 approve。
    # - workflow.remediation.mode=auto:
    #   自动执行，适合 e2e 或受控实验环境，生产谨慎开启。
    # 旧环境变量和请求参数 remediate 不再控制修复执行。

    # ------------------------------------------------------------------------
    # 1. LLM / Model Transport
    # ------------------------------------------------------------------------
    # LLM 连接与模型容量配置只从 Secret/Env 注入：
    # LLM_API_KEY / LLM_MODEL / LLM_API_BASE / MODEL_CONTEXT_WINDOW /
    # AIOPS_TOKENIZER_JSON_PATH / AIOPS_TIKTOKEN_ENCODING
    # ConfigMap 不再放默认模型，避免与 Secret 产生双配置冲突。
    llm:
      # Provider-specific OpenAI-compatible request options.
      # Qwen3 local inference can otherwise spend minutes emitting `<think>`
      # before each tool call. This is model transport control, not workflow
      # business logic.
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

    # ------------------------------------------------------------------------
    # 2. Language / i18n
    # ------------------------------------------------------------------------
    # i18n 配置 控制提示词和输出形式是中文zh还是英文en
    i18n:
      prompt_language: zh
      response_language: zh

    # ------------------------------------------------------------------------
    # 3. Tooling / MCP Servers
    # ------------------------------------------------------------------------
    # 内置工具集配置（全部关闭，所有能力由 MCP Server 提供）
    toolsets: {}

    # 第三方 MCP 服务器配置（主力工具，全部启用）
    mcp_servers:
      k8s-mcp-service:
        description: "K8s MCP - kubectl get/describe/logs/events/yaml/table 等只读资源查询"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8093/sse"
          mode: "sse"
        enabled: true

      helmcharts:
        description: "Helm MCP - helm list/status/values 等"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8092/sse"
          mode: "sse"
        enabled: false

      bash_tool:
        description: "Bash MCP - 执行 bash 命令"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8094/sse"
          mode: "sse"
        enabled: true

      prometheus_tool:
        description: "Query-only Prometheus MCP - 仅供 /query 的 node/cluster 通用 PromQL；/ask Pod 异常诊断必须使用 execute_pod_promql"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8095/sse"
          mode: "sse"
        enabled: true

      # ------------------------------------------------------------------------
      # AIOps 可观测 MCP - 自主组合查询，默认启用
      # Qwen 选择 Pod 级 PromQL、日志过滤条件和链路过滤条件。
      # ------------------------------------------------------------------------
      aiops-observability-query:
        description: "Pod 级自主可观测性查询 MCP - Qwen 按诊断目的组合 Prometheus、ES/Filebeat、DeepFlow/Tempo 查询"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8100/sse"
          mode: "sse"
        enabled: true

      # ------------------------------------------------------------------------
      # AIOps 可观测 MCP - 粗粒度兼容路径，默认关闭
      # ------------------------------------------------------------------------
      aiops-case-coarse:
        description: "AIOps Case MCP - 根据异常 Pod 实时采集 metrics/logs/traces/topology 并生成 case summary"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8089/sse"
          mode: "sse"
        enabled: false

      # ------------------------------------------------------------------------
      # AIOps 可观测 MCP - 细粒度工具，默认关闭，调试/专家模式使用
      # ------------------------------------------------------------------------
      aiops-observability-fine:
        description: "AIOps Fine MCP - 单独查询 Prometheus/ES/DeepFlow/K8s/topology 的 Pod 级观测工具"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8090/sse"
          mode: "sse"
        enabled: false
      
      core-investigation:
        description: "Core Investigation MCP - TodoWrite 任务分解与规划"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8098/sse"
          mode: "sse"
        enabled: true

      runbook:
        description: "Runbook MCP - 获取 Runbook 排障知识库"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8099/sse"
          mode: "sse"
        enabled: false

      internete:
        description: "Internet MCP - 网页抓取"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8096/sse"
          mode: "sse"
        enabled: false

      connectivity_check_tool:
        description: "TCP 连通性检查"
        config:
          url: "http://mcp-server-manager.mcp.svc.cluster.local:8097/sse"
          mode: "sse"
        enabled: false

    # ------------------------------------------------------------------------
    # 4. Diagnosis Workflow
    # ------------------------------------------------------------------------
    # 工作流配置
    workflow:
      # RCA 节点调用模式: lite(不带工具,避免重复) / full(原有全工具模式)
      rca_mode: lite
      # RCA 事实 ID/实体绑定与 claim 级发布校验暂时关闭：
      # 直接保留第一次模型分析，不触发校验降级或结构导向的二次 repair。
      rca_validation:
        enabled: false
      # RCA 结构化输出：tolerant=辅助字段类型错误时保留核心根因；
      # strict=任一 Pydantic 字段错误即整体判为 inconclusive。
      rca_structured_output:
        mode: tolerant
      # 节点启用/禁用（false 跳过该节点，conclusion 不可禁用）
      nodes:
        layer: true
        evidence: true
        rca: true
        conclusion: true

      # max_steps 直接作为 LangGraph recursion_limit，不做公式转换
      # 注意：LangGraph 每轮 model→tools 算 2 次 recursion，建议配置值 >= 预期工具调用数 * 2 + 5
      max_steps:
        layer: 15
        evidence: 20
        rca: 0
        conclusion: 0

      # 结构化运行时: 控制 layer/evidence/rca 是否优先产出 Pydantic 结构化结果。
      structured_runtime:
        enabled: true
        fallback_enabled: true

      # 节点高级行为: 全局 layer 保留完整定位；显式 Pod 在首次真实状态确认后停止。
      layer:
        early_stop:
          enabled: false
          explicit_pod_enabled: true
      evidence:
        # autonomous: Qwen 组合 Kubernetes 与三个通用可观测性查询工具。
        # legacy: 保留 collect_aiops_case mandatory coarse 兼容行为。
        observability_mode: autonomous
        # 首轮按异常 Pod 强制真实尝试 Metrics、Logging、Tracing；
        # 三维返回后仍由 Qwen 自主决定是否使用更精确参数继续补证。
        observability_first_round_gate:
          enabled: true
        early_stop:
          enabled: true
        # 补证策略（架构决策）：不在代码层做补采控制。agent 在 ReAct 循环内
        # 根据真实工具结果自主决定是否继续补证，硬约束只有 max_steps 与
        # 上下文预算（context_compaction / 80% 硬顶）。
        # Pod lane 扇出：默认所有异常 Pod（含 N=1）都使用同一独立
        # evidence + formal RCA + artifact 契约，不随 N 变化切换数据路径。
        parallel:
          enabled: true
          threshold: 0        # 0=任意异常 Pod 都进入 lane；正数仅用于兼容旧路由
          lane_concurrency: 0  # 0=按异常 Pod 数全量 fan-out；正数为显式 lane 上限

      conclusion:
        # agent: canonical facts + 正式根因交给 conclusion LLM 组织富 Markdown。
        # deterministic: 仅作为显式兼容模式，使用代码拼接实体卡片。
        presentation_mode: agent
        # 原始工具结果已经完整归档，默认不在用户报告中重复附加。
        include_raw_evidence_appendix: false
        # 最终报告输出 token 上限；query 短答，diagnosis 完整报告。
        max_tokens:
          query: 1024
          diagnosis: 8192

      # --------------------------------------------------------------------
      # 4.1 Post-Diagnosis Remediation
      # --------------------------------------------------------------------
      # 修复执行: executor=deterministic 固定执行计划；executor=react 由 LLM 多轮观察后决策。
      remediation:
        enabled: false               # 2026-08-07 用户要求暂时关闭修复审批流程
        executor: react
        mode: review                 # review=人工审批；auto=自动执行
        # mode: auto
        approval_timeout_seconds: 600
        max_iterations: 10           # react 最大思考/观察轮次
        max_write_actions: 10        # react 最多执行多少个写动作
        max_duration_seconds: 900    # react 总耗时上限
        verify_settle_seconds: 5   # 写动作后等待再验证单位秒

      # --------------------------------------------------------------------
      # 4.2 Streaming / Context Control
      # --------------------------------------------------------------------
      # `<think>` 展示: full=完整展示；truncated=截断展示；hidden=隐藏。
      think_stream:
        # mode: hidden
        # mode: truncated
        mode: full
        max_chars: 1200

      # 工具输出摘要: rule=规则摘要；ai=额外 LLM 摘要，更慢。
      observation_summary:
        mode: rule
        max_chars: 3000

      # 上下文压缩: evidence 上下文超过 trigger_ratio 时压缩历史工具观察。
      context_compaction:
        enabled: true
        nodes:
          - evidence
        max_context_window: 35000
        trigger_ratio: 0.70
        max_compactions_per_call: 1
        summary_max_tokens: 1200
        # structured output 在调用模型前执行硬预算门禁。32K 模型默认将
        # system/user/schema 总输入限制在 72%，并为输出和 tokenizer 偏差留空间。
        hard_guard_enabled: true
        hard_guard_input_ratio: 0.72
        hard_guard_safety_tokens: 2000
        hard_guard_preserve_tail_tokens: 1200

    # ------------------------------------------------------------------------
    # 5. Quality Metrics
    # ------------------------------------------------------------------------
    # 质量指标配置
    metrics:
      enabled: false  # 是否在输出中显示质量指标（false 时只显示性能统计和诊断追踪）
      thresholds:
        mttr_seconds: 600
        rca_confidence: 0.8
        evidence_completeness: 0.9
      confidence_dimensions:
        evidence_strength:
          weight: 0.35
          description: "加权证据完整率"
        causal_chain:
          weight: 0.20
          description: "因果链完整性"
        tool_coverage:
          weight: 0.10
          description: "关键探针覆盖率"
        runbook_match:
          weight: 0.15
          description: "Runbook 匹配质量"
        llm_self_score:
          weight: 0.20
          description: "LLM 自评分数"
      penalties:
        critical_missing: 0.15
        critical_missing_cap: 0.45
        fallback_applied: 0.05
      evidence_level_weights:
        CRITICAL: 1.0
        IMPORTANT: 0.6
        SUPPLEMENTARY: 0.3
      baseline:
        with_evidence: 0.80
        with_root_cause: 0.75

    # ------------------------------------------------------------------------
    # 6. Federation
    # ------------------------------------------------------------------------
    # 联邦查询配置
    federation:
      enabled: true
      max_tokens_per_agent: 0
      synthesis_timeout: 300
      sub_agents:
        - name: "main"
          url: "http://localhost:8000"
          description: "主集群"
          enabled: true
        - name: "cluster-24"
          url: "http://10.2.0.24:30800"
          description: "被管集群 10.2.0.24"
          enabled: true
