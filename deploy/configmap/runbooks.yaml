  pod-quick-diagnosis.md: |
    # Pod 异常快速诊断流程

    > **类型**: `procedure`（流程型）
    > **用途**: Pod 异常诊断的统一入口，根据状态路由到具体手册
    > **参考**: [阿里云 Pod 异常问题排查](https://help.aliyun.com/zh/ack/ack-managed-and-ack-dedicated/user-guide/pod-troubleshooting-1)

    ## Step 1: 获取 Pod 状态

    ```bash
    kubectl get pod <pod-name> -n <namespace> -o wide
    ```

    或者查找异常 Pod：
    ```bash
    kubectl get pod -A | grep -v Running | grep -v Completed
    ```

    ## Step 2: 根据状态路由诊断

    | Pod 状态 | 说明 | 对应手册 |
    |---------|------|---------|
    | `Pending` | 等待调度 | → pod-pending.md |
    | `ImagePullBackOff` / `ErrImagePull` | 镜像拉取失败 | → pod-image-pull-failed.md |
    | `CrashLoopBackOff` / `Error` | 容器崩溃循环 | → pod-crashloop-backoff.md |
    | `Running` (0/1 Ready) | 健康检查失败 | → pod-not-ready.md |
    | `Terminating` | 删除卡住 | → pod-terminating.md |
    | `Evicted` | 被驱逐 | → pod-evicted.md |
    | `CreateContainerConfigError` | 配置错误 | → 检查 ConfigMap/Secret |

    ## Step 3: 获取详细信息

    ```bash
    # 查看 Pod 详情和事件
    kubectl describe pod <pod-name> -n <namespace>
    
    # 查看容器日志
    kubectl logs <pod-name> -n <namespace>
    
    # 查看上次崩溃的日志（如果是 CrashLoopBackOff）
    kubectl logs <pod-name> -n <namespace> --previous
    ```

    ## Step 4: 执行对应手册

    根据 Step 2 识别的状态，调用 `fetch_runbook` 获取对应手册并执行诊断。

  # ==========================================================================
  # Pod 调度失败 (Pending)
  # ==========================================================================
  pod-pending.md: |
    # Pod 调度失败 (Pending) 诊断手册

    > **类型**: `knowledge`（知识型）
    > **适用场景**: Pod 长时间处于 Pending 状态，未被调度到任何节点
    > **参考**: [阿里云 Pod 调度问题](https://help.aliyun.com/zh/ack/ack-managed-and-ack-dedicated/user-guide/pod-troubleshooting-1)

    ## 故障特征
    
    **状态关键词**: `Pending`、`Unschedulable`、`FailedScheduling`
    
    **典型事件**:
    - `0/x nodes are available`
    - `Insufficient cpu/memory`
    - `node(s) didn't match node selector`
    - `node(s) had taint that the pod didn't tolerate`
    - `persistentvolumeclaim not found`

    ## 诊断命令

    ```bash
    # 查看 Pod 事件（关键！）
    kubectl describe pod <pod-name> -n <namespace> | grep -A 20 Events
    
    # 查看节点资源使用情况
    kubectl get nodes -o wide
    kubectl describe nodes | grep -A 5 "Allocated resources"
    
    # 查看节点污点
    kubectl describe nodes | grep Taints
    ```

    ## 常见场景与解决方案

    ### 场景 1: 节点资源不足
    
    **事件**: `0/x nodes are available: x Insufficient cpu/memory`
    
    **根因**: 集群 CPU 或内存资源已耗尽
    
    **诊断**:
    ```bash
    # 查看节点资源分配
    kubectl describe nodes | grep -A 10 "Allocated resources"
    ```
    
    **修复**:
    - 删除不必要的 Pod 释放资源
    - 降低 Pod 的 requests 值
    - 扩容节点

    ### 场景 2: 节点选择器不匹配
    
    **事件**: `node(s) didn't match node selector`
    
    **根因**: Pod 指定了 nodeSelector，但没有节点具有该标签
    
    **诊断**:
    ```bash
    # 查看 Pod 的 nodeSelector
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.nodeSelector}'
    
    # 查看节点标签
    kubectl get nodes --show-labels
    ```
    
    **修复**:
    - 为节点添加标签：`kubectl label node <node> <key>=<value>`
    - 或修改 Pod 的 nodeSelector

    ### 场景 3: 节点污点（Taint）问题
    
    **事件**: `node(s) had taint that the pod didn't tolerate`
    
    **根因**: 节点设置了污点，但 Pod 没有对应的容忍
    
    **诊断**:
    ```bash
    # 查看节点污点
    kubectl describe nodes | grep Taints
    ```
    
    **修复**:
    - 为 Pod 添加 toleration
    - 或移除节点污点：`kubectl taint nodes <node> <key>-`

    ### 场景 4: PVC 未绑定
    
    **事件**: `persistentvolumeclaim "xxx" not found` 或 `unbound PersistentVolumeClaim`
    
    **根因**: Pod 引用的 PVC 不存在或未绑定
    
    **诊断**:
    ```bash
    # 查看 PVC 状态
    kubectl get pvc -n <namespace>
    kubectl describe pvc <pvc-name> -n <namespace>
    ```
    
    **修复**:
    - 创建对应的 PVC
    - 或检查 StorageClass 是否正确

    ### 场景 5: 节点处于 NotReady 状态
    
    **事件**: `no nodes available to schedule pods`
    
    **根因**: 所有节点都处于不可用状态
    
    **诊断**:
    ```bash
    kubectl get nodes
    kubectl describe node <node-name>
    ```
    
    **修复**: 恢复节点状态（检查 kubelet、网络等）

    ## 🔧 通用修复命令

    ```bash
    # 查看 Pod 调度失败的具体原因
    kubectl describe pod <pod-name> -n <namespace> | grep -A 20 Events
    
    # 如果是资源不足，查看可释放的资源
    kubectl get pod -A --sort-by='.status.startTime' | head -20
    
    # 强制重新调度（删除后自动重建）
    kubectl delete pod <pod-name> -n <namespace>
    ```

