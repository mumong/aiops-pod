  pod-image-pull-failed.md: |
    # 镜像拉取失败 (ImagePullBackOff) 诊断手册

    > **类型**: `knowledge`（知识型）
    > **适用场景**: Pod 处于 ImagePullBackOff 或 ErrImagePull 状态
    > **参考**: [阿里云镜像拉取问题](https://help.aliyun.com/zh/ack/ack-managed-and-ack-dedicated/user-guide/pod-troubleshooting-1)

    ## 故障特征
    
    **状态关键词**: `ImagePullBackOff`、`ErrImagePull`、`ImageInspectError`
    
    **典型事件**:
    - `Failed to pull image`
    - `unauthorized: authentication required`
    - `manifest unknown`
    - `connection refused` / `timeout`

    ## 诊断命令

    ```bash
    # 查看 Pod 事件（获取具体错误信息）
    kubectl describe pod <pod-name> -n <namespace> | grep -A 10 Events
    
    # 查看 Pod 使用的镜像
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.containers[*].image}'
    
    # 查看 imagePullSecrets 配置
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.imagePullSecrets}'
    ```

    ## 常见场景与解决方案

    ### 场景 1: 镜像地址错误
    
    **事件**: `manifest unknown`、`not found`
    
    **根因**: 镜像名称或标签（tag）不存在
    
    **诊断**:
    ```bash
    # 检查镜像地址是否正确
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.containers[*].image}'
    ```
    
    **修复**:
    - 确认镜像名称和标签拼写正确
    - 确认镜像已推送到仓库
    - 检查是否使用了正确的 registry 地址

    ### 场景 2: 认证失败（私有仓库）
    
    **事件**: `unauthorized: authentication required`、`no basic auth credentials`
    
    **根因**: 私有镜像仓库需要认证，但未配置或配置错误
    
    **诊断**:
    ```bash
    # 检查 imagePullSecrets
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.imagePullSecrets}'
    
    # 检查 Secret 是否存在
    kubectl get secret -n <namespace>
    ```
    
    **修复**:
    ```bash
    # 创建 docker-registry 类型的 Secret
    kubectl create secret docker-registry <secret-name> \
      --docker-server=<registry-url> \
      --docker-username=<username> \
      --docker-password=<password> \
      -n <namespace>
    
    # 在 Pod/Deployment 中引用
    # spec.imagePullSecrets:
    #   - name: <secret-name>
    ```

    ### 场景 3: 网络不通
    
    **事件**: `connection refused`、`timeout`、`dial tcp: lookup xxx: no such host`
    
    **根因**: 节点无法访问镜像仓库
    
    **诊断**:
    ```bash
    # 在节点上测试网络连通性
    kubectl run test-network --image=busybox --rm -it -- wget -O- <registry-url>
    
    # 检查 DNS 解析
    kubectl run test-dns --image=busybox --rm -it -- nslookup <registry-host>
    ```
    
    **修复**:
    - 检查网络策略（NetworkPolicy）
    - 检查防火墙规则
    - 检查 DNS 配置

    ### 场景 4: 镜像拉取速度慢
    
    **事件**: 长时间处于 `Pulling` 状态
    
    **根因**: 镜像过大或网络带宽不足
    
    **修复**:
    - 使用镜像加速器
    - 优化镜像大小（多阶段构建）
    - 预拉取镜像到节点

    ## 🔧 通用修复命令

    ```bash
    # 手动在节点上拉取镜像测试
    crictl pull <image-url>
    
    # 删除 Pod 触发重试
    kubectl delete pod <pod-name> -n <namespace>
    
    # 检查镜像是否存在（使用 curl）
    curl -v https://<registry>/v2/<image>/manifests/<tag>
    ```

