  # ==========================================================================
  # L0: Pod 存储卷超限被驱逐 (Volume Limit Exceeded)
  # ==========================================================================
  l0-volume-limit.md: |
    # L0 Pod 存储卷超限被驱逐

    > 层级: L0 - 基础设施层 | 场景: Volume Limit Exceeded / Disk Pressure Eviction

    ## 场景识别

    | 信号 | 关键特征 |
    |------|----------|
    | Pod 状态 | STATUS=Evicted, Error, 或 Pending |
    | Events | `The node was low on resource: ephemeral-storage` / `exceeds the limit` |
    | Describe | Reason: Evicted, Message 含 sizeLimit / emptyDir / ephemeral-storage |
    | 节点级 | `df -h` 显示 Use% >= 95%, 或 `ENOSPC` 错误 |

    ## 诊断流程

    ### Step 1: 定位异常 Pod
    ```bash
    kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded | grep -v Completed
    ```

    ### Step 2: 确认驱逐原因（关键步骤）
    ```bash
    kubectl describe pod <pod-name> -n <namespace>
    ```
    重点关注:
    - `Status`: Evicted / Failed
    - `Reason`: Evicted
    - `Message`: 包含 `exceeds the limit` 或 `ephemeral-storage`
    - `Containers.*.Limits`: ephemeral-storage 的限制值

    ### Step 3: 检查节点磁盘状态
    ```bash
    kubectl get nodes -o wide
    kubectl describe node <node-name> | grep -A5 "Conditions" | grep -E "DiskPressure|MemoryPressure"
    ```

    ### Step 4: 检查 Volume 配置
    ```bash
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.volumes}' | python3 -m json.tool
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.containers[*].resources}'
    ```

    ### Step 5: 检查节点级磁盘使用（如有节点访问权限）
    ```bash
    df -h
    du -sh /var/lib/kubelet/pods/ 2>/dev/null | sort -hr | head -10
    ```

    ## 判定规则

    | 条件 | 结论 | 置信度 |
    |------|------|--------|
    | Reason=Evicted + Message 含 ephemeral-storage/sizeLimit | Volume 超限驱逐 | 高 |
    | Reason=Evicted + Message 含 disk pressure | 节点磁盘压力驱逐 | 高 |
    | df 显示 Use% >= 95% + ENOSPC 错误 | 节点磁盘空间耗尽 | 高 |
    | Inode 使用率 >= 95% | Inode 耗尽 | 高 |

  # ==========================================================================
  # L2: Pod OOMKilled (Exit Code 137)
  # ==========================================================================
  l2-oomkilled.md: |
    # L2 Pod OOMKilled (Exit Code 137)

    > 层级: L2 - 工作负载层 | 场景: 容器内存超限被 OOM Killer 终止

    ## 场景识别

    | 信号 | 关键特征 |
    |------|----------|
    | Pod 状态 | CrashLoopBackOff / Error / 频繁重启 |
    | Describe | terminated.reason=OOMKilled, exitCode=137 |
    | Last State | OOMKilled |
    | 区分 L0 | 如果 Reason=Evicted 则是 L0 而非 L2，必须用 describe 确认 |

    ## 诊断流程

    ### Step 1: 确认 Pod 状态和重启次数
    ```bash
    kubectl get pod <pod-name> -n <namespace> -o wide
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.status.containerStatuses[*].restartCount}'
    ```

    ### Step 2: 确认 OOMKilled（关键步骤）
    ```bash
    kubectl describe pod <pod-name> -n <namespace>
    ```
    重点关注:
    - `Last State`: Terminated, Reason: OOMKilled, Exit Code: 137
    - `State`: Waiting, Reason: CrashLoopBackOff
    - 区分: 如果 Reason 是 Evicted 而非 OOMKilled，则属于 L0

    ### Step 3: 获取崩溃前日志
    ```bash
    kubectl logs <pod-name> -n <namespace> --previous --tail=200
    ```
    关注: 内存分配失败、Java heap space、Cannot allocate memory 等错误

    ### Step 4: 检查资源配置
    ```bash
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.containers[*].resources}' | python3 -m json.tool
    ```
    关注: limits.memory 的值是否合理

    ### Step 5: 检查 Events 时间线
    ```bash
    kubectl get events -n <namespace> --field-selector involvedObject.name=<pod-name> --sort-by='.lastTimestamp'
    ```

    ## 判定规则

    | 条件 | 结论 | 置信度 |
    |------|------|--------|
    | terminated.reason=OOMKilled 或 exitCode=137 + 非 Evicted | OOMKilled | 高 |
    | 日志含 "Cannot allocate memory" / "Java heap space" | 内存不足 | 高 |
    | exitCode=137 + Reason=Evicted | 非 OOM，属于 L0 | 高 |
    | exitCode=1/127 且无 OOM 标记 | 非 OOM，应用错误 | 中 |

  # ==========================================================================
  # L3: 镜像拉取失败 (ImagePullBackOff)
  # ==========================================================================
  l3-imagepull-failed.md: |
    # L3 镜像拉取失败 (ImagePullBackOff)

    > 层级: L3 - 服务网络层 | 场景: 容器镜像拉取失败

    ## 场景识别

    | 信号 | 关键特征 |
    |------|----------|
    | Pod 状态 | ImagePullBackOff / ErrImagePull / ImageInspectError |
    | Events | `Failed to pull image`, `connection refused`, `timeout`, `manifest unknown` |
    | 常见原因 | 仓库不可达、镜像不存在、认证失败、DNS 解析失败 |

    ## 诊断流程

    ### Step 1: 确认 Pod 状态
    ```bash
    kubectl get pod <pod-name> -n <namespace> -o wide
    ```

    ### Step 2: 获取详细事件（关键步骤）
    ```bash
    kubectl describe pod <pod-name> -n <namespace>
    ```
    重点关注 Events 部分:
    - `Failed to pull image "xxx"`: 具体镜像地址
    - `connection canceled/refused/timeout`: 网络不可达
    - `manifest unknown/not found`: 镜像或 tag 不存在
    - `unauthorized/no basic auth`: 认证失败

    ### Step 3: 检查镜像地址和 Pull Secret
    ```bash
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.containers[*].image}'
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.imagePullSecrets}'
    ```

    ### Step 4: 测试镜像仓库连通性
    ```bash
    kubectl run curl-test --rm -it --image=curlimages/curl --restart=Never -- \
      curl -sI https://<registry-host>/v2/ --connect-timeout 5
    ```

  

    ## 判定规则

    | 条件 | 结论 | 置信度 |
    |------|------|--------|
    | Events 含 connection refused/timeout | 镜像仓库网络不可达 | 高 |
    | Events 含 manifest unknown/not found | 镜像或 tag 不存在 | 高 |
    | Events 含 unauthorized/no basic auth | 认证失败（缺少或错误的 imagePullSecret） | 高 |
    | DNS 解析失败 | DNS 问题导致仓库不可达 | 高 |

  # ==========================================================================
  # L4: 依赖服务固定返回 503
  # ==========================================================================
  l4-dependency-503.md: |
    # L4 依赖服务返回 503 (Service Unavailable)

    > 层级: L4 - 应用层 | 场景: 上游/依赖服务不可用导致应用 5xx

    ## 场景识别

    | 信号 | 关键特征 |
    |------|----------|
    | 应用日志 | 含 `upstream 503`、`service unavailable`、`connection refused` |
    | HTTP 状态码 | 应用返回 502/503/504，依赖服务直接返回 503 |
    | Endpoints | 依赖 Service 的 Endpoints 可能为空或 NotReady |
    | 区分 L3 | 如果 Endpoints 为空，问题在 L3（Service/网络层），非 L4 |

    ## 诊断流程

    ### Step 1: 量化应用 5xx 错误
    ```bash
    kubectl logs -n <namespace> deploy/<app-name> --tail=500 | grep -c " 5[0-9][0-9]"
    ```

    ### Step 2: 确认上游 503（关键步骤）
    ```bash
    kubectl logs -n <namespace> deploy/<app-name> --tail=500 | grep -iE "upstream|503|service.unavailable" | tail -30
    ```
    重点关注:
    - `upstream connect error or disconnect/reset before headers`
    - `503 Service Temporarily Unavailable`
    - 具体的依赖服务地址和端口

    ### Step 3: 直接验证依赖服务状态
    ```bash
    kubectl run curl-test --rm -it --image=curlimages/curl --restart=Never -- \
      curl -s -o /dev/null -w "http_code=%{http_code}\n" http://<dep-svc>.<namespace>:<port>/
    ```

    ### Step 4: 检查依赖 Service 的 Endpoints
    ```bash
    kubectl get endpoints <dep-svc> -n <namespace> -o wide
    kubectl get pods -n <namespace> -l app=<dep-app> -o wide
    ```
    关注: Endpoints 是否为空、后端 Pod 是否 Running/Ready

    ### Step 5: 检查依赖 Pod 状态和日志
    ```bash
    kubectl get pods -n <namespace> -l app=<dep-app>
    kubectl logs -n <namespace> deploy/<dep-app> --tail=100
    ```

    ## 判定规则

    | 条件 | 结论 | 置信度 |
    |------|------|--------|
    | 依赖 curl=503 + 应用日志有 upstream 503 | 依赖服务不可用 (L4) | 高 |
    | 依赖 curl=200 但应用仍 5xx | 非依赖原因，需检查应用自身 | 中 |
    | Endpoints 为空 | Service 层问题 (L3)，非 L4 | 高 |
    | 依赖 Pod CrashLoopBackOff | 依赖服务崩溃导致 503 | 高 |

  # ==========================================================================
  # L4: 应用启动配置校验失败 (ConfigBootstrapFail)
  # ==========================================================================
  l4-config-bootstrap-fail.md: |
    # L4 应用启动配置校验失败 (Config Bootstrap Fail)

    > 层级: L4 - 应用层 | 场景: 应用在启动阶段因业务配置缺失或非法而主动退出

    ## 场景识别

    | 信号 | 关键特征 |
    |------|----------|
    | Pod 状态 | `CrashLoopBackOff` / `Error`，重启次数持续增加 |
    | 容器日志 | 含 `L4_CONFIG_BOOTSTRAP_FAIL`、`missing required APP_BOOT_MODE`、`config validation failed` |
    | Describe | `Last State: Terminated`，`Exit Code: 42` 或其他业务退出码 |
    | 区分 L2 | 无 `OOMKilled`、无 `Exit Code 137` |
    | 区分 L3 | 无 `ImagePullBackOff`、容器实际已启动并输出业务日志 |
    | 区分 L0 | 无 `Evicted`、无 `disk pressure`、无 `ENOSPC` |

    ## 诊断流程

    ### Step 1: 确认 Pod 是否处于 CrashLoopBackOff
    ```bash
    kubectl get pods -n <namespace> -l app=<app-name> -o wide
    ```
    关注:
    - `STATUS` 是否为 `CrashLoopBackOff`
    - `RESTARTS` 是否持续增长

    ### Step 2: 查看 describe 中的退出状态（关键步骤）
    ```bash
    kubectl describe pod <pod-name> -n <namespace>
    ```
    重点关注:
    - `State: Waiting, Reason: CrashLoopBackOff`
    - `Last State: Terminated`
    - `Reason: Error`
    - `Exit Code: 42` 或其他非 137 业务退出码

    ### Step 3: 获取上一次崩溃前日志（关键步骤）
    ```bash
    kubectl logs <pod-name> -n <namespace> --previous --tail=200
    ```
    重点关注:
    - `L4_CONFIG_BOOTSTRAP_FAIL`
    - `missing required APP_BOOT_MODE`
    - `business config validation failed before server startup`

    ### Step 4: 回溯配置来源
    ```bash
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.containers[*].env}' | python3 -m json.tool
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.containers[*].envFrom}' | python3 -m json.tool
    kubectl get configmap -n <namespace>
    kubectl get secret -n <namespace>
    ```
    关注:
    - 必填环境变量是否缺失
    - ConfigMap/Secret 键名是否拼错
    - 配置值是否不符合应用约束

    ### Step 5: 结合应用启动逻辑确认根因
    ```bash
    kubectl logs <pod-name> -n <namespace> --previous --tail=200 | grep -iE "config|bootstrap|missing|required|validation"
    ```
    关注:
    - 启动前配置解析失败
    - 业务模式、端口、租户等必填配置缺失

    ## 判定规则

    | 条件 | 结论 | 置信度 |
    |------|------|--------|
    | CrashLoopBackOff + 日志含配置校验失败/缺参 | 应用启动配置错误 (L4) | 高 |
    | Exit Code 非 137 + 无 OOMKilled + 日志为业务错误 | 应用层启动失败 (L4) | 高 |
    | Last State=OOMKilled 或 Exit Code=137 | 属于 L2，非本场景 | 高 |
    | STATUS=ImagePullBackOff / ErrImagePull | 属于 L3，非本场景 | 高 |
    | Reason=Evicted 或 Message 含 disk pressure/ENOSPC | 属于 L0，非本场景 | 高 |

  # ==========================================================================
  # L1: Node NotReady (Taint 导致)
  # ==========================================================================
  l1-taint-node.md: |
    # L1 Node NotReady / Taint 导致不可调度

    > 层级: L1 - 集群与节点层 | 场景: 节点 NotReady 或被 Taint 标记为不可调度

    ## 场景识别

    | 信号 | 关键特征 |
    |------|----------|
    | 节点状态 | `kubectl get nodes` 显示 STATUS=NotReady 或 Unknown |
    | Taint | 节点被标记 NoSchedule/NoExecute taint |
    | Pod 调度 | 新 Pod 处于 Pending，Events 含 `node(s) had taint` |
    | 区分 L0 | L0 是 Pod 级别（Evicted/磁盘），L1 是节点级别（NotReady/Taint） |

    ## 诊断流程

    ### Step 1: 检查节点状态
    ```bash
    kubectl get nodes -o wide
    ```
    关注: STATUS 列是否有 NotReady/Unknown，AGE 判断是否新节点

    ### Step 2: 检查异常节点详情（关键步骤）
    ```bash
    kubectl describe node <node-name>
    ```
    重点关注:
    - `Conditions` 部分: Ready=False/Unknown 的 reason 和 message
    - `Taints` 部分: 是否有 NoSchedule/NoExecute taint
    - `Allocatable` vs `Capacity`: 资源是否耗尽
    - `Non-terminated Pods`: 节点上运行的 Pod 数量

    ### Step 3: 检查 Ready 条件详情
    ```bash
    kubectl get node <node-name> -o jsonpath='{.status.conditions[?(@.type=="Ready")]}' | python3 -m json.tool
    ```
    关注: status, reason, message, lastHeartbeatTime

    ### Step 4: 检查节点事件
    ```bash
    kubectl get events -A --field-selector involvedObject.kind=Node,involvedObject.name=<node-name> --sort-by='.lastTimestamp'
    ```
    关注: NodeNotReady、NodeNotSchedulable、PLEG unhealthy 等事件

    ### Step 5: 检查受影响的 Pod
    ```bash
    kubectl get pods -A --field-selector spec.nodeName=<node-name> -o wide
    kubectl get pods -A --field-selector status.phase=Pending | head -20
    ```

    ## 判定规则

    | 条件 | 结论 | 置信度 |
    |------|------|--------|
    | Ready=False + Taint NoSchedule 存在 | 节点不可调度，新 Pod 无法分配 | 高 |
    | Ready=Unknown + lastHeartbeatTime 超时 | kubelet 与 API Server 通信中断 | 高 |
    | Ready=False + Conditions 含 DiskPressure/MemoryPressure | 节点资源压力导致 NotReady | 高 |
    | Taint 存在但 Ready=True | 人为标记不可调度（维护模式） | 中 |

  # ==========================================================================
  # QUERY: 快速查询参考手册
  # ==========================================================================
  query-reference.md: |
    # QUERY 模式快速查询参考手册

    > **类型**: reference | **适用**: 数据查询、指标获取、状态检查

    ## 1. 基础：节点与 IP 映射

    查询任何指标前，**必须先建立节点名称与 IP 的映射关系**：
    ```bash
    kubectl get nodes -o wide
    ```
    Prometheus 的 `instance` label 格式为 `IP:9100`，**不是节点名称**。

    ## 2. PromQL Label 使用规则

    **核心原则：不要假设 label 存在，先查确认。**
    ```promql
    # 先查原始指标，看返回了哪些 label
    node_memory_MemTotal_bytes
    ```
    - ❌ `{node="master"}` — 通常不存在
    - ❌ `{kubernetes_io_hostname="master"}` — 通常不存在
    - ✅ `{instance="10.2.0.48:9100"}` — 用 instance label
    - ✅ `by (instance)` — 按 instance 分组

    ## 3. 常见指标查询

    ### CPU
    ```promql
    # 集群总体
    100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
    # 按节点
    (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance)) * 100
    ```

    ### 内存
    ```promql
    # 集群总体
    (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100
    # 按节点
    (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
    ```

    ### 磁盘
    ```promql
    (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100
    ```

    ### 网络
    ```promql
    rate(node_network_receive_bytes_total{device!~"lo|veth.*|cali.*"}[5m])
    ```

    ## 4. 数据验证（Double Check）

    - kubectl 显示 N 个节点 → Prometheus 按节点查询应返回 N 条结果
    - 每个节点的数据必须独立展示，不能合并
    - 内存总量应为 8/16/32/64/128GB 级别
    - 使用率 0-100% 范围
    - bytes 除以 1024^3 = GiB

    ### 交叉验证
    ```bash
    free -h      # 内存验证
    nproc        # CPU 核心数
    df -h        # 磁盘验证
    ```
