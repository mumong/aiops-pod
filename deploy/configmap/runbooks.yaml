  # L3: 镜像拉取失败 (ImagePullBackOff)
  # ==========================================================================
  l3-imagepull-failed.md: |
    # 镜像拉取失败 (ImagePullBackOff) 诊断手册

    > **层级**: L3 - 网络层 | **类型**: procedure | **场景ID**: L3-ImagePullBackOff

    ## 故障特征

    **状态关键词**: `ImagePullBackOff`、`ErrImagePull`、`ImageInspectError`

    **典型事件**:
    - `Failed to pull image`
    - `connection refused` / `timeout`
    - `manifest unknown`

    ## 诊断命令

    ```bash
    # 查看 Pod 事件（获取具体错误信息）
    kubectl describe pod <pod-name> -n <namespace> | grep -A 10 Events

    # 查看 Pod 使用的镜像
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.containers[*].image}'

    # 查看 imagePullSecrets 配置
    kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.imagePullSecrets}'
    ```

    ## 常见场景与解决方案

    ### 场景 1: 镜像仓库网络不可达

    **事件**: `connection canceled`、`timeout`

    **根因**: 节点无法访问镜像仓库（可能被 iptables 阻断）

    **诊断**:
    ```bash
    # 检查 iptables 规则
    iptables -L -n | grep -i reject

    # 在节点上测试网络连通性
    curl -v https://registry-1.docker.io/v2/

    # 检查 DNS 解析
    nslookup registry-1.docker.io
    ```

    **修复**:
    ```bash
    # 移除 iptables REJECT 规则（如被阻断）
    iptables -D OUTPUT -d registry-1.docker.io -j REJECT
    iptables -D INPUT -s registry-1.docker.io -j REJECT

    # 删除 Pod 触发重试
    kubectl delete pod <pod-name> -n <namespace>
    ```

    ### 场景 2: 镜像地址错误

    **事件**: `manifest unknown`、`not found`

    **根因**: 镜像名称或标签（tag）不存在

    **修复**:
    - 确认镜像名称和标签拼写正确
    - 确认镜像已推送到仓库

    ### 场景 3: 认证失败（私有仓库）

    **事件**: `unauthorized: authentication required`、`no basic auth credentials`

    **修复**:
    ```bash
    kubectl create secret docker-registry <secret-name> \
      --docker-server=<registry-url> \
      --docker-username=<username> \
      --docker-password=<password> \
      -n <namespace>
    ```

    ## 证据链

    | 步骤 | 命令/工具 | 原始数据 | 分析结论 |
    |-------|------------|----------|-----------|
    | 1 | kubectl get pod | STATUS=ImagePullBackOff | Pod 异常状态 |
    | 2 | kubectl describe pod | Events: Failed to pull image, connection canceled | 镜像拉取失败 |
    | 3 | iptables -L | registry-1.docker.io REJECT 规则存在 | 网络层被阻断 |
    | 4 | curl -v registry | timeout/connection refused | 镜像仓库不可达 |

  # ==========================================================================
  # L4: 依赖服务固定返回 503
  # ==========================================================================
  l4-dependency-503.md: |
    # L4 依赖服务固定返回 503

    > **层级**: L4 - 应用层 | **类型**: procedure | **场景ID**: L4-Dependency503

    ---

    ## 1. 场景识别特征

    ### 1.1 触发关键词
    | 类别 | 关键词 |
    |------|--------|
    | 中文 | 依赖异常、上游 503、5xx 激增、Service Unavailable |
    | 英文 | upstream 503, service unavailable, 5xx |
    | 状态 | HTTP 503 (Service Unavailable) |

    ### 1.2 快速判定
    ```
    IF (curl 依赖返回 503) AND (应用日志有 upstream 503):
        场景 = L4-Dependency503, 置信度 = 高
    ```

    ## 2. 证据清单

    | # | 证据项 | 级别 | 采集命令 | 判定依据 |
    |---|--------|------|----------|----------|
    | E1 | 应用 5xx 统计 | Critical | `kubectl logs | grep -c 5xx` | 有 5xx |
    | E2 | 应用日志上游错误 | Critical | `kubectl logs | grep upstream` | upstream 503 |
    | E3 | 依赖服务返回码 | Critical | `curl -w "%{http_code}"` | 503 |
    | E4 | 依赖 Endpoints | Important | `kubectl get endpoints` | 有后端 |

    ## 3. 固定取证流程

    ```bash
    # Step 1: 量化应用 5xx
    kubectl logs -n <ns> deploy/<app> --tail=500 | grep -c " 5[0-9][0-9]"

    # Step 2: 从应用日志证明 upstream=503
    kubectl logs -n <ns> deploy/<app> --tail=500 | grep -i "upstream\|503" | tail -30

    # Step 3: 直接验证依赖返回码
    kubectl run curl-test --rm -it --image=curlimages/curl -- \
      curl -s -o /dev/null -w "http_code=%{http_code}\n" http://<dep-svc>:<port>/

    # Step 4: 检查依赖 Endpoints
    kubectl get endpoints <dep-svc> -n <ns> -o wide
    ```

    ## 4. 判定规则

    | 规则ID | 条件 | 结论 | 置信度 |
    |--------|------|------|--------|
    | R-L4-DEP-1 | 依赖 curl=503 + 应用日志有 upstream 503 | Dependency503 | 高 |
    | R-L4-DEP-2 | 依赖 curl=200 但应用仍 5xx | 非依赖原因 | 中 |
    | R-L4-DEP-3 | Endpoints 为空 | L3 问题 | 高 |

    ## 5. 修复方案

    ### 立即止血
    ```bash
    kubectl rollout undo deploy/<dep> -n <ns>  # 回滚
    kubectl rollout restart deploy/<dep> -n <ns>  # 或重启
    curl http://<dep-svc>:<port>/health  # 确认恢复
    ```

    ### 根治
    - 依赖侧：健康检查 + 灰度发布
    - 应用侧：熔断 + 降级 + 重试策略

  # ==========================================================================
  # L1: Node NotReady (Taint 导致)
  # ==========================================================================
  l1-taint-node.md: |
    # L1 Kubelet 通信故障 - Node NotReady 诊断手册
    # 场景：节点被标记为不可调度 (NoSchedule taint)，AI Agent 通过 kubectl get nodes 直接看到异常

    ---

    ## 场景识别特征

    | 类别 | 关键词 | 典型表现 |
    |------|--------|----------|
    | Taint 标签 | aiops-test-scenario=l1-node-issue | 故障注入标记 |
    | 节点状态 | NotReady, Unknown, NoSchedule | kubectl get nodes 显示节点异常 |
    | 调度状态 | Unschedulable | 节点标记为不可调度 |

    ---

    ## 1. 诊断步骤

    ### 1.1 检查节点状态

    ```bash
    kubectl get nodes -o wide
    ```

    **预期结果**：
    - `STATUS` 列显示 `NotReady` 或 `Unknown`
    - `ROLES` 列显示节点角色
    - `VERSION` 列显示 kubelet 版本

    ---

    ### 1.2 检查节点条件

    ```bash
    kubectl get node <node-name> -o jsonpath='{.status.conditions[?(@.type=="Ready")]}'
    ```

    **预期结果**：
    - `status` 字段为 `False`
    - `reason` 可能显示 `NodeTaintUnschedulable`
    - `message` 显示具体原因

    ---

    ### 1.3 检查节点 Taint

    ```bash
    kubectl describe node <node-name>
    ```

    **预期结果**：
    - `Taints` 部分显示 taint 信息

    ---

    ## 2. 排查步骤

    ### 2.1 检查 kubelet 日志

    ```bash
    journalctl -u kubelet --since "60 min ago" | tail -100
    ```

    **关注信息**：
    - x509 证书错误
    - TLS 握手失败
    - API Server 连接失败

    ---

    ### 2.2 检查节点事件

    ```bash
    kubectl get events -A --field-selector involvedObject.kind=Node,involvedObject.name=<node-name> --sort-by='.lastTimestamp'
    ```

    **关注信息**：
    - NodeReady 状态变化事件
    - Taint 相关事件
    - FailedMount, PLEG unhealthy 相关事件

    ---

    ## 3. 证据链

    | 步骤 | 命令/工具 | 原始数据 | 分析结论 |
    |-------|------------|----------|-----------|
    | 1 | kubectl get nodes | STATUS=NotReady, Taints 存在 | 节点被标记为不可用 |
    | 2 | kubectl get node ...jsonpath | status=False | Ready 条件未满足 |
    | 3 | kubectl describe node | Taints 包含故障标记 | 存在故障注入 |
    | 4 | kubectl get events | NodeNotReady 相关事件 | 集群记录节点异常 |

    ---

    ## 4. 根因分析

    ### 4.1 层级判定

    **层级**: L1 - 集群与节点层

    **判定理由**：
    - 异常发生在节点级别（Node NotReady）
    - Taint 标记导致调度器不再调度 Pod
    - 这是典型的 **L1 层节点问题**
    - 你需要进行对比验证。得到结论的时候要利用 工具命令来验证对比，二次确认！ -

    ---

    ### 4.2 可能原因

    | 可能性 | 原因 | 置信度 | 说明 |
    |---------|------|--------|------|
    | 高 | Taint 导致节点被标记为不可调度 | 90% | 预期的故障注入 |
    | 中 | kubelet 证书问题 | 70% | 需要检查证书有效性 |
    | 低 | 网络分区 | 50% | 可能导致 API Server 不可达 |

    ---

    ## 5. 快速命令参考

    ```bash
    # 诊断
    alias diag-node='kubectl get nodes && kubectl describe node && kubectl get events -A --field-selector involvedObject.kind=Node'

    # 快速检查 Ready 节点
    kubectl get nodes --no-headers | grep Ready | grep -v NotReady

    # 检查特定节点的所有条件
    kubectl get node <node-name> -o jsonpath='{.status.conditions[*]}'

    # 清理 taint
    kubectl taint nodes <node-name> <taint-key>-

    # 查看 kubelet 日志
    journalctl -u kubelet --tail=50
    ```
