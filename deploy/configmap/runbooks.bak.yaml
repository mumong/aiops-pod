  # ==========================================================================
  private-k8s-health-reference.md: |
    # 私有化 Kubernetes 环境健康与高效排查参考手册

    > 类型: reference | 适用: 私有化 Kubernetes 环境 | 环境特征: Calico + NFS + containerd

    ## 目的

    本手册不是某个具体故障的处理步骤，而是一个**额外知识参考**：
    - 帮助理解在私有化 Kubernetes 环境中，健康检查应重点关注哪些资源与信号
    - 帮助在诊断时兼顾**效率**和**完整性**
    - 强调**当前状态优先**、**最小必要探测**、**按证据扩展**
    - 参考完后如果有其他合适的场景的runbooks作为更加细致和详细的参考你也应该去引用和查看！

    ## 核心原则

    ### 原则 1: 健康检查不等于 Pod 全部 Running
    以下情况都可能导致“Pod 看起来正常，但环境实际上不健康”：
    - Pod Running，但 `Service` 没有 `Endpoints`
    - Pod Running，但 `readinessProbe` 失败或 `availableReplicas < desiredReplicas`
    - Node `Ready=True`，但存在 `MemoryPressure` / `DiskPressure`
    - PVC 未绑定、NFS 挂载异常、CSI/挂载链路异常
    - CoreDNS 正常运行，但 DNS 解析或上游转发异常
    - Calico Pod 存活，但路由、策略或 BGP/overlay 出现异常

    ### 原则 2: 当前状态优先于历史事件
    - Events 只能作为线索，不能单独等于当前故障
    - 只有当事件指向的对象**当前仍存在且当前仍异常**，才能作为当前故障依据
    - 如果对象已恢复、已替换或已删除，则该事件只算历史背景

    ### 原则 3: 最小必要探测，禁止默认全量扫描
    高效排查的目标是：
    - 先从用户问题涉及的对象与相邻资源面开始
    - 先做**最便宜、最容易确认当前状态**的查询
    - 已经获得足够证据后立即停止扩展

    不推荐每次默认做：
    - 所有命名空间全量 describe
    - 所有节点日志遍历
    - 全量 Prometheus 指标扫描
    - 全量网络抓包

    ### 原则 4: 先确认“当前是否真的异常”，再确认“异常在哪一面”
    推荐顺序：
    1. 用户提到的资源当前状态是否异常
    2. 与其最相邻的资源面是否异常
    3. 只有相邻面不能解释时，再扩大范围

    ## 高效健康检查基线

    当用户问“我的集群有什么问题”“现在健康吗”“这个服务为什么不通”时，优先覆盖以下检查面，但不要机械地全部展开。

    ### 1. 节点面
    关键对象:
    - `Node`
    - `Node Conditions`
    - `kubelet`
    - `containerd`

    优先关注:
    - `Ready`
    - `MemoryPressure`
    - `DiskPressure`
    - `PIDPressure`
    - 节点是否频繁切换 `Ready/NotReady`

    最小检查:
    ```bash
    kubectl get nodes -o wide
    kubectl describe node <node-name>
    ```

    何时继续深入:
    - 只有当节点状态异常、条件异常、或大量 Pod 都集中在同一节点异常时
    - 再去看 `journalctl -u kubelet`、`journalctl -u containerd`

    ### 2. 工作负载面
    关键对象:
    - `Pod`
    - `Deployment`
    - `StatefulSet`
    - `DaemonSet`
    - `Job/CronJob`

    优先关注:
    - `CrashLoopBackOff`
    - `OOMKilled`
    - `Pending`
    - `ContainerCreating`
    - `Terminating`
    - `readyReplicas` / `availableReplicas`

    最小检查:
    ```bash
    kubectl get pods -A -o wide
    kubectl get deploy,statefulset,daemonset -A
    ```

    何时继续深入:
    - 只有当某个工作负载当前异常时，再对该对象执行 `describe` / `logs --previous`

    ### 3. Service 与流量面
    关键对象:
    - `Service`
    - `Endpoints`
    - `EndpointSlice`
    - `Ingress`
    - CoreDNS
    - Calico 相关组件

    优先关注:
    - `Service` 是否有 `Endpoints`
    - selector 是否匹配到正确 Pod
    - Pod 是否 `Ready`
    - DNS 是否可解析
    - Calico 网络插件是否正常

    最小检查:
    ```bash
    kubectl get svc,endpoints,endpointslices -A
    kubectl get pods -n kube-system -l k8s-app=kube-dns
    kubectl get pods -n kube-system -l k8s-app=calico-node
    ```

    何时继续深入:
    - 只有当“服务不可用、访问失败、DNS 异常、跨节点不通”时
    - 再扩展到 `kubectl describe svc`、`iptables`、`tcpdump`、Calico 日志

    ### 4. 存储面
    关键对象:
    - `PVC`
    - `PV`
    - `StorageClass`
    - NFS 服务端可达性与导出目录

    对于 NFS 环境，优先关注:
    - `PVC Pending`
    - 挂载超时或权限错误
    - NFS 服务器不可达
    - stale file handle / access denied / mount timeout

    最小检查:
    ```bash
    kubectl get pvc,pv -A
    kubectl describe pvc <pvc-name> -n <namespace>
    kubectl describe pod <pod-name> -n <namespace>
    ```

    何时继续深入:
    - 只有当 Pod 处于 `Pending` / `ContainerCreating` / `MountVolume` 相关错误时

