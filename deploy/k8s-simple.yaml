# K8s AIOps Copilot - 部署配置
# 注意：namespace 由 Makefile 的 deploy 目标创建（kubectl create namespace ... | apply），
# 这里不再声明 Namespace，避免 make delete 时误删 namespace。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-copilot
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-copilot
  template:
    metadata:
      labels:
        app: aiops-copilot
    spec:
      serviceAccountName: aiops-copilot
      initContainers:
        - name: fix-reports-permissions
          image: xnet.registry.io:8443/caopeng/docker.io/library/busybox:1.36
          command: ["sh", "-c", "mkdir -p /tmp/aiops/reports/context_archives && chmod 777 /tmp/aiops/reports /tmp/aiops/reports/context_archives"]
          volumeMounts:
            - name: reports-volume
              mountPath: /tmp/aiops/reports
      containers:
        - name: aiops-copilot
          image: xnet.registry.io:8443/xnet-cloud/aiops-copilot:11.0.150
          imagePullPolicy: IfNotPresent # 每次都拉取最新镜像
          ports:
            - containerPort: 8000
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: LLM_API_KEY
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: LLM_MODEL
                  optional: true
            - name: LLM_API_BASE
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: LLM_API_BASE
                  optional: true
            - name: MODEL_CONTEXT_WINDOW
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: MODEL_CONTEXT_WINDOW
                  optional: true
            - name: AIOPS_TOKENIZER_JSON_PATH
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: AIOPS_TOKENIZER_JSON_PATH
                  optional: true
            - name: AIOPS_TIKTOKEN_ENCODING
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: AIOPS_TIKTOKEN_ENCODING
                  optional: true
            # 关闭上下文用量探针：它每请求会多次真实 POST /chat/completions 做精确
            # token 计数（全量 prefill），对诊断结果零影响，仅为遥测。默认关闭以降延迟，
            # 需要精确用量遥测时改回 "true"（或走 secretKeyRef）。见 docs/adr/0001。
            - name: AIOPS_CONTEXT_USAGE_PROBE
              value: "false"
            # 日志级别（DEBUG/INFO/WARNING/ERROR）
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: LOG_LEVEL
                  optional: true  # 可选，默认 INFO
            - name: CONFIG_FILE
              value: "/app/config-override/config.yaml"
            - name: AIOPS_CONTEXT_ARCHIVE_ROOT
              value: "/tmp/aiops/reports/context_archives"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config-override
              readOnly: true
            - name: runbooks-volume
              mountPath: /app/knowledge_base/runbooks
              readOnly: true
            - name: reports-volume
              mountPath: /tmp/aiops/reports
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
        # Official Agent2Agent Protocol v0.3.0 adapter. It runs in an isolated
        # image because a2a-sdk 0.3.25 requires httpx>=0.28.1 while
        # holmesgpt 0.21.0 requires httpx<0.28.
        - name: a2a-adapter
          image: xnet.registry.io:8443/xnet-cloud/aiops-a2a-adapter:11.0.150
          imagePullPolicy: IfNotPresent
          ports:
            - name: a2a
              containerPort: 8001
          env:
            - name: A2A_BACKEND_URL
              value: "http://127.0.0.1:8000"
            # Agent Card 中对其他 Agent 公布的协议地址。若调用方在集群外，
            # 部署时改为可访问的网关或 NodePort URL，例如 http://HOST:30801。
            - name: A2A_PUBLIC_URL
              value: "http://aiops-copilot.aiops.svc.cluster.local:8001"
            - name: A2A_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: A2A_API_TOKEN
                  optional: true
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: LOG_LEVEL
                  optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: a2a
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: a2a
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: config-volume
          configMap:
            name: aiops-config
        - name: runbooks-volume
          configMap:
            name: aiops-runbooks
        - name: reports-volume
          persistentVolumeClaim:
            claimName: aiops-reports-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiops-reports-pvc
  namespace: aiops
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: aiops-copilot
  namespace: aiops
spec:
  selector:
    app: aiops-copilot
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
    - name: a2a
      port: 8001
      targetPort: 8001
      nodePort: 30801
  type: NodePort
