# K8s AIOps Copilot - 部署配置
# 注意：namespace 由 Makefile 的 deploy 目标创建（kubectl create namespace ... | apply），
# 这里不再声明 Namespace，避免 make delete 时误删 namespace。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-copilot
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-copilot
  template:
    metadata:
      labels:
        app: aiops-copilot
    spec:
      serviceAccountName: aiops-copilot
      initContainers:
        - name: fix-reports-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /tmp/aiops/reports && chmod 777 /tmp/aiops/reports"]
          volumeMounts:
            - name: reports-volume
              mountPath: /tmp/aiops/reports
      containers:
        - name: aiops-copilot
          image: xnet.registry.io:8443/xnet-cloud/aiops-copilot:7.0.8
          imagePullPolicy: IfNotPresent # 每次都拉取最新镜像
          ports:
            - containerPort: 8000
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: LLM_API_KEY
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: LLM_MODEL
                  optional: true
            - name: LLM_API_BASE
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: LLM_API_BASE
                  optional: true
            # AI 自动修复开关（true=允许执行修复操作，false=仅诊断）
            - name: AUTO_REMEDIATE
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: AUTO_REMEDIATE
                  optional: true  # 可选，默认 false（仅诊断）
            # 日志级别（DEBUG/INFO/WARNING/ERROR）
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: LOG_LEVEL
                  optional: true  # 可选，默认 INFO
            - name: CONFIG_FILE
              value: "/app/config-override/config.yaml"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config-override
              readOnly: true
            - name: runbooks-volume
              mountPath: /app/knowledge_base/runbooks
              readOnly: true
            - name: reports-volume
              mountPath: /tmp/aiops/reports
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: config-volume
          configMap:
            name: aiops-config
        - name: runbooks-volume
          configMap:
            name: aiops-runbooks
        - name: reports-volume
          hostPath:
            path: /tmp/aiops/reports
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: aiops-copilot
  namespace: aiops
spec:
  selector:
    app: aiops-copilot
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
  type: NodePort
