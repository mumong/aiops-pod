# K8s AIOps Copilot - 部署配置
# 注意：namespace 由 Makefile 的 deploy 目标创建（kubectl create namespace ... | apply），
# 这里不再声明 Namespace，避免 make delete 时误删 namespace。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-copilot
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-copilot
  template:
    metadata:
      labels:
        app: aiops-copilot
    spec:
      serviceAccountName: aiops-copilot
      containers:
        - name: aiops-copilot
          image: xnet.registry.io:8443/xnet-cloud/aiops-copilot:41.3.0
          imagePullPolicy: Always  # 每次都拉取最新镜像
          ports:
            - containerPort: 8000
          env:
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: DEEPSEEK_API_KEY
            - name: DEEPSEEK_MODEL
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: DEEPSEEK_MODEL
                  optional: true  # 可选，不存在时使用默认值
            - name: BASH_TOOL_UNSAFE_ALLOW_ALL
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: BASH_TOOL_UNSAFE_ALLOW_ALL
            # 工作流模式开关（true=LangGraph工作流，false=原有HolmesGPT模式）
            - name: USE_WORKFLOW
              valueFrom:
                secretKeyRef:
                  name: aiops-secret
                  key: USE_WORKFLOW
                  optional: true  # 可选，默认 false
            - name: CONFIG_FILE
              value: "/app/config-override/config.yaml"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config-override
              readOnly: true
            - name: runbooks-volume
              mountPath: /app/knowledge_base/runbooks
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: config-volume
          configMap:
            name: aiops-config
        - name: runbooks-volume
          configMap:
            name: aiops-runbooks

---
apiVersion: v1
kind: Service
metadata:
  name: aiops-copilot
  namespace: aiops
spec:
  selector:
    app: aiops-copilot
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
  type: NodePort
