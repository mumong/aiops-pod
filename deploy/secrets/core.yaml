# ============================================================================
# 核心 Secret - LLM API 配置
# ============================================================================
# HolmesGPT 使用此配置连接 LLM 服务
#
# 使用方式:
#   1. 填入真实的 API Key
#   2. kubectl apply -f deploy/secrets/core.yaml
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: aiops-secret
  namespace: aiops
type: Opaque
stringData:
  # DeepSeek API 配置
  # ⚠️ 请在部署前替换为真实 Key（不要提交真实密钥到仓库）
  DEEPSEEK_API_KEY: "REDACTED_API_KEY"
  # DEEPSEEK_API_BASE: "https://api.deepseek.com"  # 可选，默认值
  # DEEPSEEK_MODEL: "deepseek-reasoner"                # 可选，默认值
  DEEPSEEK_MODEL: "deepseek-chat"                # 可选，默认值

  # ⚠️ Bash 命令安全配置
  # 设为 true 允许执行所有 bash 命令（包括 df, du, docker prune 等）
  # 默认 false，只允许白名单内的只读命令
  # 默认建议 false；如确需允许更广泛的 bash 命令，请评估风险后开启
  BASH_TOOL_UNSAFE_ALLOW_ALL: "true"

  # ============================================================================
  # 工作流模式配置
  # ============================================================================
  # 设为 true 启用 LangGraph 工作流模式（分阶段诊断）
  # 设为 false 使用原有 HolmesGPT agentic loop
  USE_WORKFLOW: "true"

  # ============================================================================
  # 质量指标阈值配置（可选，不设置则使用默认值）
  # ============================================================================
  # MTTR 阈值（秒），默认 600 秒（10 分钟）
  METRICS_MTTR_THRESHOLD: "900"

  # 根因置信度阈值（0-1），默认 0.8（80%）
  METRICS_RCA_CONFIDENCE_THRESHOLD: "0.8"

  # 证据完整率阈值（0-1），默认 0.9（90%）
  METRICS_EVIDENCE_THRESHOLD: "0.8"

  USE_MULTI_SCENARIO: "false"