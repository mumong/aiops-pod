# ============================================================================
# 核心 Secret - LLM API 配置
# ============================================================================
# HolmesGPT 使用此配置连接 LLM 服务
#
# 使用方式:
#   1. 填入真实的 API Key
#   2. kubectl apply -f deploy/secrets/core.yaml
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: aiops-secret
  namespace: aiops
type: Opaque
stringData:
  # ============================================================================
  # LLM 提供商配置（切换模型只需改这 3 个值，重新 apply 即可）
  # ============================================================================
  #
  # ── DeepSeek（默认） ──────────────────────────────────────────────────
  # LLM_API_KEY: "REDACTED_API_KEY"
  # LLM_MODEL: "deepseek/deepseek-chat"
  # LLM_API_BASE: ""                     # DeepSeek 无需代理，留空即可
  #
  # ── Qwen3 本地部署（取消下方注释，注释上方即可切换） ────────────────
  LLM_API_KEY: "xnet"
  LLM_MODEL: "openai/Qwen3-Next-80B-A3B-Instruct"
  LLM_API_BASE: "http://10.2.0.98:8001/v1"
  #
  # ── Claude（取消下方注释，注释上方 DeepSeek 即可切换） ──────────────
  # LLM_API_KEY: "s"
  # LLM_MODEL: "anthropic/claude-sonnet-4-6"
  # LLM_API_BASE: "xxx"
  #
  # ── GLM 智谱（OpenAI 兼容模式） ──────────────────────────────────────
  # LLM_API_KEY: "REDACTED_API_KEY"
  # LLM_MODEL: "openai/glm-4"
  # LLM_API_BASE: "https://open.bigmodel.cn/api/paas/v4"
  #
  # ── OpenAI ────────────────────────────────────────────────────────────
  # LLM_API_KEY: "sk-你的openai-key"
  # LLM_MODEL: "openai/gpt-4o"
  # LLM_API_BASE: ""
  # ============================================================================
  # ⚠️ Bash 命令安全配置
  # 设为 true 允许执行所有 bash 命令（包括 df, du, docker prune 等）
  # 默认 false，只允许白名单内的只读命令
  # 默认建议 false；如确需允许更广泛的 bash 命令，请评估风险后开启
  BASH_TOOL_UNSAFE_ALLOW_ALL: "true"

  # ============================================================================
  # 工作流模式配置
  # ============================================================================
  # 设为 true 启用 LangGraph 工作流模式（分阶段诊断）
  # 设为 false 使用原有 HolmesGPT agentic loop
  USE_WORKFLOW: "true"
  # ============================================================================
  # AI 调用层切换（true=新 AICall 路径，false=原有 HolmesGPT 路径）
  USE_AICALL: "true"
  # ============================================================================
  # AI 自动修复开关
  # ============================================================================
  # false（默认）= 仅诊断分析，禁止执行任何修复操作
  # true = 诊断完成后允许 AI 执行修复操作（kubectl apply/rollout/taint 等）
  AUTO_REMEDIATE: "false"
  # ============================================================================
  LOG_LEVEL: "DEBUG"
  