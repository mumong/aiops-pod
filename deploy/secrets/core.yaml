# 模型配置（Secret aiops-secret）。默认值可直接部署；换模型或换 token 时改这里，再 make deploy。
# 多集群中心默认也用这份；中心要用不同模型时，另建 deploy-edge/center/secret.yaml（不入库）。
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secret
  namespace: aiops
type: Opaque
stringData:
  LLM_MODEL: "openai/Qwen3.6-35B-A3B"
  LLM_API_BASE: "http://10.2.0.54:4000/v1"
  LLM_API_KEY: "sk-lggZbTfU7pJejiIu7Q_PZQ"
  LLM_REASONING_EFFORT: ""   # 支持 reasoning_effort 的模型填 low/medium/high
  MODEL_CONTEXT_WINDOW: "54000"   # 模型服务实际的上下文 token 数
  AIOPS_CONTEXT_USAGE_PROBE: "true"
  LOG_LEVEL: "INFO"
  # 运行时切换审批/自动修复（PUT /repair/policy/mode）的管理员 token
  AIOPS_ADMIN_TOKEN: "ykJJEGI470gNeir18jXGLOjzgtw1Ec4doBt80LKEq2w"
  # 脚本/其他 agent 调用 API 的身份，"名字=token"，多个用逗号分隔（docs/api.md）
  AIOPS_API_TOKENS: "a2a=VgfgrO2ITW33rJeNe70RMMwlcTFEYZR6AgB-rbdRDK0"
  # A2A 边车访问后端的 token，必须等于上面 a2a= 的值
  A2A_BACKEND_API_TOKEN: "VgfgrO2ITW33rJeNe70RMMwlcTFEYZR6AgB-rbdRDK0"
