# ============================================================================
# 核心 Secret - LLM API 配置
# ============================================================================
# HolmesGPT 使用此配置连接 LLM 服务
#
# 使用方式:
#   1. 填入真实的 API Key
#   2. kubectl apply -f deploy/secrets/core.yaml
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: aiops-secret
  namespace: aiops
type: Opaque
stringData:
  # ============================================================================
  # LLM 提供商配置（切换模型只需改这 3 个值，重新 apply 即可）
  # ============================================================================
  #
  # ── DeepSeek（默认） ──────────────────────────────────────────────────
  # LLM_API_KEY: "REDACTED_API_KEY"
  # LLM_MODEL: "deepseek/deepseek-chat"
  # LLM_API_BASE: ""                     # DeepSeek 无需代理，留空即可
  #
  # ── Qwen3 本地部署（取消下方注释，注释上方即可切换） ────────────────
  LLM_API_KEY: "REDACTED_DEEPSEEK_API_KEY"
  LLM_MODEL: "openai/Qwen3-32B-AWQ"
  LLM_API_BASE: "http://10.2.0.54:4000/v1"
  # 当前模型的真实上下文窗口 token 数。用于 context_budget 百分比计算。
  # Qwen3-32B-AWQ 通常填 32768；Qwen3-Next-80B-64K 填 65536。
  MODEL_CONTEXT_WINDOW: "32768"
  # 可选：模型服务实际 tokenizer.json。设置后 token budget 才能对 Qwen 做准确 token 计数。
  # AIOPS_TOKENIZER_JSON_PATH: "/models/Qwen3-32B-AWQ/tokenizer.json"
  # 可选：OpenAI/tiktoken 编码名。Qwen 不建议用这个替代 tokenizer.json。
  # AIOPS_TIKTOKEN_ENCODING: "cl100k_base"
  #
  # ── Claude（取消下方注释，注释上方 DeepSeek 即可切换） ──────────────
  # LLM_API_KEY: "s"
  # LLM_MODEL: "anthropic/claude-sonnet-4-6"
  # LLM_API_BASE: "xxx"
  #
  # ── GLM 智谱（OpenAI 兼容模式） ──────────────────────────────────────
  # LLM_API_KEY: "288f7def28c1443abc91bd637beeef86.1c6u7RL8o3DG175X"
  # LLM_MODEL: "openai/glm-4"
  # LLM_API_BASE: "https://open.bigmodel.cn/api/paas/v4"
  #
  # ── OpenAI ────────────────────────────────────────────────────────────
  # LLM_API_KEY: "sk-你的openai-key"
  # LLM_MODEL: "openai/gpt-4o"
  # LLM_API_BASE: ""
  # ============================================================================
  # ⚠️ 安全与运行时配置
  # ============================================================================
  # AI 自动修复开关
  # false（默认）= 仅诊断分析，禁止执行任何修复操作
  # true = 诊断完成后允许 AI 执行修复操作（kubectl apply/rollout/taint 等）
  AUTO_REMEDIATE: "false"
  # 日志级别 DEBUG/INFO/
  # LOG_LEVEL: "INFO"
  LOG_LEVEL: "DEBUG"
  # `<think>` 流式展示模式: full / truncated / hidden
  AIOPS_THINK_STREAM_MODE: "full"
  # truncated 模式下最多展示的 think 字符数
  AIOPS_THINK_STREAM_MAX_CHARS: "1200"
  # 工具 observation 摘要策略: rule / ai
  AIOPS_OBSERVATION_SUMMARY_MODE: "rule"
  AIOPS_OBSERVATION_SUMMARY_MAX_CHARS: "3000"
  
