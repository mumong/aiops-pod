# Synthetic data, evaluated by the unmodified Prometheus v3.5.0 engine.
# No recording rules, services, cluster access, or model calls.
rule_files: []
evaluation_interval: 10s
tests:
  - name: one_source_sample_reused_at_multiple_evaluation_steps
    interval: 10s
    input_series:
      - series: 'demo_gauge{namespace="example",pod="workload",container="app"}'
        values: '7 _ _ _ _'
    promql_expr_test:
      - expr: demo_gauge
        eval_time: 40s
        exp_samples:
          - labels: 'demo_gauge{namespace="example",pod="workload",container="app"}'
            value: 7
      - expr: count_over_time(demo_gauge[50s:10s])
        eval_time: 40s
        exp_samples:
          - labels: '{namespace="example",pod="workload",container="app"}'
            value: 5
      - expr: count_over_time(demo_gauge[50s])
        eval_time: 40s
        exp_samples:
          - labels: '{namespace="example",pod="workload",container="app"}'
            value: 1
      - expr: timestamp(demo_gauge)
        eval_time: 40s
        exp_samples:
          - labels: '{namespace="example",pod="workload",container="app"}'
            value: 0
      - expr: changes(timestamp(demo_gauge)[50s:10s])
        eval_time: 40s
        exp_samples:
          - labels: '{namespace="example",pod="workload",container="app"}'
            value: 0
      - expr: timestamp(demo_gauge + 0)
        eval_time: 40s
        exp_samples:
          - labels: '{namespace="example",pod="workload",container="app"}'
            value: 40
      - expr: >-
          label_replace(demo_gauge, "obs_channel", "value", "__name__", ".*")
          or label_replace(timestamp(demo_gauge), "obs_channel", "source_timestamp", "__name__", ".*")
        eval_time: 40s
        exp_samples:
          - labels: 'demo_gauge{namespace="example",pod="workload",container="app",obs_channel="value"}'
            value: 7
          - labels: '{namespace="example",pod="workload",container="app",obs_channel="source_timestamp"}'
            value: 0
  - name: repeated_equal_values_from_five_distinct_source_samples
    interval: 10s
    input_series:
      - series: 'demo_gauge{namespace="example",pod="workload",container="app"}'
        values: '7 7 7 7 7'
    promql_expr_test:
      - expr: demo_gauge
        eval_time: 40s
        exp_samples:
          - labels: 'demo_gauge{namespace="example",pod="workload",container="app"}'
            value: 7
      - expr: count_over_time(demo_gauge[50s:10s])
        eval_time: 40s
        exp_samples:
          - labels: '{namespace="example",pod="workload",container="app"}'
            value: 5
      - expr: count_over_time(demo_gauge[50s])
        eval_time: 40s
        exp_samples:
          - labels: '{namespace="example",pod="workload",container="app"}'
            value: 5
      - expr: timestamp(demo_gauge)
        eval_time: 40s
        exp_samples:
          - labels: '{namespace="example",pod="workload",container="app"}'
            value: 40
      - expr: changes(timestamp(demo_gauge)[50s:10s])
        eval_time: 40s
        exp_samples:
          - labels: '{namespace="example",pod="workload",container="app"}'
            value: 4
  - name: explicit_staleness_is_not_missing_scrape
    interval: 10s
    input_series:
      - series: 'demo_gauge{namespace="example",pod="workload",container="app"}'
        values: '7 stale _ _ _'
    promql_expr_test:
      - expr: demo_gauge
        eval_time: 40s
        exp_samples: []
