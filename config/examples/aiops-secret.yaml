# Copy to deploy/secrets/core.yaml and replace placeholders locally.
# This example intentionally lives outside recursively applied deploy/.
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secret
  namespace: aiops
type: Opaque
stringData:
  LLM_API_KEY: "<API key>"
  LLM_MODEL: "<provider/model>"
  LLM_API_BASE: "<OpenAI-compatible API base>"
  MODEL_CONTEXT_WINDOW: "54000"
  AIOPS_CONTEXT_USAGE_PROBE: "false"
  LOG_LEVEL: "INFO"
  # Optional: enables the runtime review/auto switch (PUT /repair/policy/mode). Generate with
  # `python3 -c "import secrets;print(secrets.token_urlsafe(32))"`. Absent = switch disabled.
  AIOPS_ADMIN_TOKEN: "<random admin token>"
  # Optional: API principals for scripts / agents (docs/api.md), "name=token" pairs separated
  # by commas. Each name gets its own records; approvals are audited with that name.
  AIOPS_API_TOKENS: "a2a=<random token>"
  # Optional: the A2A sidecar's token on the backend; must equal the a2a entry above.
  # Enables per-context sessions and the kubernetes-repair skill.
  A2A_BACKEND_API_TOKEN: "<same random token>"
