# LLM 提供商配置（litellm 格式）
llm:
  model: "deepseek/deepseek-chat"

# 内置工具集配置 - 只保留 MCP 无法替代的
toolsets:
  core_investigation:
    enabled: true
  runbook:
    enabled: true
  bash:
    enabled: false
  kubernetes/core:
    enabled: false
  helm/core:
    enabled: false
  kubernetes/kube-prometheus-stack:
    enabled: false
  internet:
    enabled: false
  connectivity_check:
    enabled: false
  prometheus/metrics:
    enabled: false
  kubernetes/logs:
    enabled: false
  docker/core:
    enabled: false

# 第三方 MCP 服务器配置（主力工具）
mcp_servers:
  k8s-mcp-service:
    description: "K8s MCP - kubectl get/describe/logs/events 等"
    config:
      url: "http://localhost:8093/sse"
      mode: "sse"
    enabled: true

  helmcharts:
    description: "Helm MCP - helm list/status/values 等"
    config:
      url: "http://localhost:8092/sse"
      mode: "sse"
    enabled: true

  bash_tool:
    description: "Bash MCP - 执行 bash 命令"
    config:
      url: "http://localhost:8094/sse"
      mode: "sse"
    enabled: true

  prometheus_tool:
    description: "Prometheus MCP - PromQL 查询"
    config:
      url: "http://localhost:8095/sse"
      mode: "sse"
    enabled: true

  elasticsearch:
    description: "Elasticsearch MCP - 查询索引、搜索日志"
    config:
      url: "http://localhost:8082/sse"
      mode: "sse"
    enabled: true

  internete:
    description: "Internet MCP - 网页抓取"
    config:
      url: "http://localhost:8096/sse"
      mode: "sse"
    enabled: true

  connectivity_check_tool:
    description: "TCP 连通性检查"
    config:
      url: "http://localhost:8097/sse"
      mode: "sse"
    enabled: true

  test_tool_server:
    description: "测试工具集"
    config:
      url: "http://localhost:8090/sse"
      mode: "sse"
    enabled: false

# 工作流配置
workflow:
  max_steps:
    layer: 3
    evidence: 10
    rca: 8
    conclusion: 3

# 联邦查询配置
federation:
  enabled: true
  max_tokens_per_agent: 0
  synthesis_timeout: 300
  sub_agents:
    - name: "cluster-24"
      url: "http://10.2.0.24:30800"
      description: "被管集群 10.2.0.24"
      enabled: true
    - name: "main"
      url: "http://localhost:30800"
      description: "主集群真实地址是10.2.0.48"
      enabled: true
