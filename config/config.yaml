# LLM 提供商配置（litellm 格式）
llm:
  model: "deepseek/deepseek-chat"

# 内置工具集配置 - 只保留 MCP 无法替代的
toolsets:
  core_investigation:
    enabled: true
  runbook:
    enabled: true
  bash:
    enabled: false
  kubernetes/core:
    enabled: false
  helm/core:
    enabled: false
  kubernetes/kube-prometheus-stack:
    enabled: false
  internet:
    enabled: false
  connectivity_check:
    enabled: false
  prometheus/metrics:
    enabled: false
  kubernetes/logs:
    enabled: false
  docker/core:
    enabled: false

# 第三方 MCP 服务器配置（主力工具）
mcp_servers:
  k8s-mcp-service:
    description: "K8s MCP - kubectl get/describe/logs/events 等"
    config:
      url: "http://localhost:8093/sse"
      mode: "sse"
    enabled: true

  helmcharts:
    description: "Helm MCP - helm list/status/values 等"
    config:
      url: "http://localhost:8092/sse"
      mode: "sse"
    enabled: true

  bash_tool:
    description: "Bash MCP - 执行 bash 命令"
    config:
      url: "http://localhost:8094/sse"
      mode: "sse"
    enabled: true

  prometheus_tool:
    description: "Prometheus MCP - PromQL 查询"
    config:
      url: "http://localhost:8095/sse"
      mode: "sse"
    enabled: true

  elasticsearch:
    description: "Elasticsearch MCP - 查询索引、搜索日志"
    config:
      url: "http://localhost:8082/sse"
      mode: "sse"
    enabled: true

  internete:
    description: "Internet MCP - 网页抓取"
    config:
      url: "http://localhost:8096/sse"
      mode: "sse"
    enabled: true

  connectivity_check_tool:
    description: "TCP 连通性检查"
    config:
      url: "http://localhost:8097/sse"
      mode: "sse"
    enabled: true

  test_tool_server:
    description: "测试工具集"
    config:
      url: "http://localhost:8090/sse"
      mode: "sse"
    enabled: false

# 工作流配置
workflow:
  # RCA 节点调用模式: lite(不带工具,避免重复) / full(原有全工具模式)
  rca_mode: lite
  max_steps:
    layer: 3
    evidence: 12
    rca: 10
    conclusion: 3

# 质量指标配置
metrics:
  thresholds:
    mttr_seconds: 600          # MTTR 阈值（秒），默认 10 分钟
    rca_confidence: 0.8        # 根因置信度阈值
    evidence_completeness: 0.9 # 证据完整率阈值

  # 置信度评分维度权重（总和应为 1.0）
  confidence_dimensions:
    evidence_strength:
      weight: 0.35
      description: "加权证据完整率"
    causal_chain:
      weight: 0.25
      description: "因果链完整性"
    tool_coverage:
      weight: 0.15
      description: "关键探针覆盖率"
    runbook_match:
      weight: 0.15
      description: "Runbook 匹配质量"
    llm_self_score:
      weight: 0.10
      description: "LLM 自评分数"

  # 惩罚项配置
  penalties:
    critical_missing: 0.15     # 每项关键证据缺失扣分
    critical_missing_cap: 0.45 # 封顶
    fallback_applied: 0.05     # 回退路径扣分

  # 证据级别权重
  evidence_level_weights:
    CRITICAL: 1.0
    IMPORTANT: 0.6
    SUPPLEMENTARY: 0.3

  # 保底分配置（有结论+有证据时的最低置信度）
  baseline:
    with_evidence: 0.80      # 有结论 + 有证据/工具调用
    with_root_cause: 0.75    # 有结论 + 有根因但无工具证据

# 联邦查询配置
federation:
  enabled: true
  max_tokens_per_agent: 0
  synthesis_timeout: 300
  sub_agents:
    - name: "cluster-24"
      url: "http://10.2.0.24:30800"
      description: "被管集群 10.2.0.24"
      enabled: true
    - name: "main"
      url: "http://localhost:30800"
      description: "主集群真实地址是10.2.0.48"
      enabled: true
